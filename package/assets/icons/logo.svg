<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#da7756"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#pgGrad)" stroke="#18181b" stroke-width="22"/>
  
  <!-- Subtle Inner Bevel Rim -->
  <rect x="44" y="44" width="424" height="424" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
  
  <!-- Stylized "P" Gaming Emblem -->
  <!-- Vertical Stem -->
  <rect x="136" y="128" width="76" height="256" rx="18" fill="#faf9f5" stroke="#18181b" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Upper Loop -->
  <path d="M 196 128 L 308 128 C 356 128 386 158 386 208 C 386 258 356 288 308 288 L 196 288 Z" 
        fill="#faf9f5" stroke="#18181b" stroke-width="14" stroke-linejoin="round"/>
        
  <!-- Loop Cutout -->
  <path d="M 212 174 L 298 174 C 322 174 340 188 340 208 C 340 228 322 242 298 242 L 212 242 Z" 
        fill="url(#pgGrad)" stroke="#18181b" stroke-width="11" stroke-linejoin="round"/>
        
  <!-- Embedded Play Triangle inside P -->
  <polygon points="248,192 248,224 280,208" fill="#faf9f5"/>
  
  <!-- Gaming D-Pad Badge Accent (bottom right) -->
  <g transform="translate(328, 346)">
    <circle cx="0" cy="0" r="38" fill="#faf9f5" stroke="#18181b" stroke-width="11"/>
    <!-- Plus Cross -->
    <rect x="-6" y="-19" width="12" height="38" rx="3" fill="#ea580c"/>
    <rect x="-19" y="-6" width="38" height="12" rx="3" fill="#ea580c"/>
  </g>
</svg>
