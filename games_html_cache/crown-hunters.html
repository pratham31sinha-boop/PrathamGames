    <!-- Initial loading screen: a playable preview of the game loop. A grass
         tuft hides a crown silhouette; chops cut it down and reveal the crown,
         then an egg cracks open to reveal a pet, each round rarer. Chops come
         on a timer while loading, and tapping adds more. Plain HTML/CSS plus
         the inline script below, so it runs before the bundle arrives. Art is
         baked by scripts/bake-loading-reel.mjs; item names stay untranslated
         like in-game. It stays mounted after boot and covers every world
         switch too (gameUI.showLoadingScreen/hideLoadingScreen). -->
    <div id='loading-screen' data-phase='grass' data-hits='0'>
        <div class='game-title' data-i18n='loading.title'>CROWN HUNTERS</div>
        <button class='loading-stage' type='button' aria-hidden='true' tabindex='-1'>

            <p data-caption='0-crown' style='--tier: #ff2698'><b data-i18n='rarity.mythic'>Mythic</b><span>Thunder Crown</span></p>

    <script>
        // Drives the #loading-screen preview above. Auto-chops while the screen
        // is up and pauses while the game has it marked done.
        (() => {
            const ROUNDS = [
                { crown: 'storm', pet: 'godly', crownTier: '#ff2698', petTier: '#ff5252' },
                { crown: 'eclipse', pet: 'eternal', crownTier: '#a98cff', petTier: '#a98cff' },
                { crown: 'scorchwing', pet: 'transcendent', crownTier: '#ffffff', petTier: '#ffffff' },
            ]
            const AUTO_CHOP_MS = 700
            const REVEAL_HOLD_MS = 1300
            const MIN_REVEAL_MS = 450
            const HITS = { grass: 3, egg: 4 }
            // How much of the front tuft (% from its top) is sliced away after n
            // chops. The last chop leaves stubble, so the crown stands in cut grass.
            const GRASS_CUTS = [0, 46, 66, 82]
            const screen = document.getElementById('loading-screen')
            const stage = screen.querySelector('.loading-stage')
            const cover = screen.querySelector('.stage-cover img')
            const prize = screen.querySelector('.stage-prize')
            const slice = screen.querySelector('.stage-slice')
            const captions = screen.querySelectorAll('[data-caption]')
            const art = (kind, id) => 'textures/loading/' + kind + '-' + id + '.webp'
            const preload = (kind, id) => { new Image().src = art(kind, id) }
            const clip = (element, inset) => { element.style.clipPath = element.style.webkitClipPath = inset }
            let round = 0, phase = 'grass', hits = 0, revealedAt = 0, holdTimer = 0, afterReveal = null

            function show(next) {
                phase = next
                hits = 0
                const current = ROUNDS[round]
                if (phase === 'grass') { cover.src = art('grass', 'tuft'); prize.src = art('crown', current.crown) }
                if (phase === 'egg') { cover.src = art('egg', current.pet); prize.src = art('pet', current.pet) }
                if (phase === 'grass' || phase === 'egg') {
                    clip(cover, 'none')
                    clip(slice, 'inset(100% 0 0 0)')
                }
                screen.style.setProperty('--tier', phase === 'grass' || phase === 'crown' ? current.crownTier : current.petTier)
                screen.dataset.phase = phase
                screen.dataset.hits = '0'
                const caption = phase === 'crown' || phase === 'pet' ? round + '-' + phase : phase
                captions.forEach(element => element.classList.toggle('active', element.dataset.caption === caption))
            }
            function replay(className) {
                stage.classList.remove(className)
                void stage.offsetWidth
                stage.classList.add(className)
            }
            function reveal(prizePhase, then) {
                show(prizePhase)
                revealedAt = performance.now()
                afterReveal = then
                replay('reveal')
                holdTimer = setTimeout(advance, REVEAL_HOLD_MS)
            }
            function advance() {
                clearTimeout(holdTimer)
                const then = afterReveal
                afterReveal = null
                if (then) then()
            }
            function hit() {
                if (!HITS[phase]) return
                hits++
                screen.dataset.hits = String(hits)
                if (phase === 'grass') {
                    // Slice the next band off the tuft's top; the slice flies off.
                    clip(cover, 'inset(' + GRASS_CUTS[hits] + '% 0 0 0)')
                    clip(slice, 'inset(' + GRASS_CUTS[hits - 1] + '% 0 ' + (100 - GRASS_CUTS[hits]) + '% 0)')
                }
                replay('hit')
                if (hits < HITS[phase]) return
                const current = ROUNDS[round]
                if (phase === 'grass') {
                    preload('egg', current.pet)
                    preload('pet', current.pet)
                    reveal('crown', () => show('egg'))
                } else {
                    const next = (round + 1) % ROUNDS.length
                    preload('crown', ROUNDS[next].crown)
                    reveal('pet', () => { round = next; show('grass') })
                }
            }

            stage.addEventListener('pointerdown', event => {
                event.preventDefault()
                if (HITS[phase]) hit()
                else if (performance.now() - revealedAt > MIN_REVEAL_MS) advance()
            })
            let autoChop = 0
            function setRunning(running) {
                if (running === !!autoChop) return
                clearInterval(autoChop)
                autoChop = running ? setInterval(hit, AUTO_CHOP_MS) : 0
                // A reveal left waiting while hidden would stall the next showing.
                if (!running) advance()
            }
            new MutationObserver(() => setRunning(!screen.classList.contains('done')))
                .observe(screen, { attributes: true, attributeFilter: ['class'] })
            setRunning(true)
        })()
    </script>

    // Prevent gestures on ipad / iphone

            event.preventDefault()
        }
    }, { passive: false })

    // Prevents double-tap zoom
    let lastTouchEnd = 0
    document.addEventListener('touchend', function(event) {
        let now = (new Date()).getTime()
        if (now - lastTouchEnd <= 300) {
            event.preventDefault()
        }
        lastTouchEnd = now
    }, { passive: false })
</script>

</body>
</html>
