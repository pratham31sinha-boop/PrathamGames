<script>
(function() {
  'use strict';
  var noop = function() {};
  var resolvedPromise = function(val) { return Promise.resolve(val); };

  var PokiMock = {
    init: function() { return resolvedPromise(); },
    initWithVideoHB: function() { return resolvedPromise(); },
    commercialBreak: function() { return resolvedPromise(); },
    rewardedBreak: function() { return resolvedPromise(true); },
    displayAd: function(e, t, o, i) {
      if (typeof i === 'function') i(true);
      if (typeof o === 'function') o();
      return resolvedPromise();
    },
    destroyAd: noop,
    getLeaderboard: function() { return resolvedPromise([]); },
    shareableURL: function() { return resolvedPromise(window.location.href); },
    getURLParam: function() { return ''; },
    getLanguage: function() { return (navigator.language || 'en').split('-')[0]; },
    getDeviceInfo: function() { return { category: 'desktop' }; },
    isAdBlocked: function() { return false; },
    getUser: function() { return resolvedPromise({ id: 'pratham_user', name: 'Gamer' }); },
    getToken: function() { return resolvedPromise('pratham_token'); },
    login: function() { return resolvedPromise({ id: 'pratham_user' }); },
    generateScreenshot: function() { return resolvedPromise(''); },
    measure: noop,
    captureError: noop,
    customEvent: noop,
    gameInteractive: noop,
    gameLoadingFinished: noop,
    gameLoadingProgress: noop,
    gameLoadingStart: noop,
    gameplayStart: noop,
    gameplayStop: noop,
    happyTime: noop,
    logError: noop,
    muteAd: noop,
    roundEnd: noop,
    roundStart: noop,
    sendHighscore: noop,
    setDebug: noop,
    setDebugTouchOverlayController: noop,
    setLogging: noop,
    setPlayerAge: noop,
    setPlaytestCanvas: noop,
    enableEventTracking: noop,
    openExternalLink: noop,
    playtestSetCanvas: noop,
    playtestCaptureHtmlOnce: noop,
    playtestCaptureHtmlForce: noop,
    playtestCaptureHtmlOn: noop,
    playtestCaptureHtmlOff: noop,
    movePill: noop,
    showLeaderboard: function() { return resolvedPromise([]); }
  };

  var pokiProxy = new Proxy(PokiMock, {
    get: function(target, prop) {
      if (prop in target) return target[prop];
      return function() { return resolvedPromise(true); };
    }
  });

  try {
    Object.defineProperty(window, 'PokiSDK', {
      value: pokiProxy,
      writable: false,
      configurable: false
    });
  } catch(e) {
    window.PokiSDK = pokiProxy;
  }
})();
</script>

    <meta charset="utf-8" />
    <!-- The game is a fixed light design. Declare it so Android Chrome's
         auto-dark ("Darken websites") never repaints our mix-blend-mode /
         mask-image / backdrop-filter layers into a darkened composite — that
         was a source of flicker and vanishing UI on Android. -->
    <meta name="color-scheme" content="only light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <title>SuperDress</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8d8e0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        user-select: none;
      }
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #ffd7e5 0%, #ff9ec9 100%);
        transition: opacity 0.4s ease;
      }
      .app-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader[hidden] {
        display: none;
      }
      .app-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      .app-loader-title {
        font:
          900 clamp(40px, 9vw, 72px)/1 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 2px;
        color: #ff3a8d;
        text-shadow:
          0 0 2px #fff,
          0 4px 12px rgba(196, 12, 76, 0.45);
      }
      /* UI kit loading ring, spun whole. Document-relative on purpose: it
         must load before the bundle (no --kit-* variables yet), and it is
         the same path src/kitSkin.ts uses (assets/UI/kit/<name>.webp). */
      .app-loader-spin {
        width: 64px;
        height: 64px;
        background: url("assets/UI/kit/loading-ring.webp") center / contain
          no-repeat;
        animation: app-loader-spin 0.9s linear infinite;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Load-failure panel. These rules live ONLY here: the panel is shown
         exactly when the game bundle failed to arrive, so the bundled
         stylesheet (src/styles.css) can never be the one styling it. */
      .app-loader-fail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 22em;
        padding: 0 24px;
      }
      .app-loader-fail[hidden] {
        display: none;
      }
      .app-loader-fail-text {
        font:
          700 clamp(16px, 4.2vw, 22px)/1.35 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
        color: #c40c4c;
      }
      .app-loader-fail-btn {
        font:
          900 clamp(16px, 4.2vw, 22px)/1 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #fff;
        background: #ff3a8d;
        border: 3px solid #fff;
        border-radius: 999px;
        /* 0.75em keeps the tap target ≥44px at the 16px clamp floor. */
        padding: 0.75em 1.6em;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(196, 12, 76, 0.45);
      }
    </style>
    <link rel="preconnect" href="https://game-cdn.poki.com" />
    <link rel="dns-prefetch" href="https://game-cdn.poki.com" />
    <!-- Exactly the tag Poki's HTML5 guide prescribes: no async, no
         crossorigin. In CORS mode the CDN answer is cached under a separate
         key and some edges hand it back without the allow-origin header, so
         the browser drops the script and the game runs with no SDK at all —
         no ads, no telemetry. Plain and blocking is what the platform tests
         against, and it guarantees PokiSDK exists before the game bundle. -->
    
    <script type="module" crossorigin src="./assets/index-DEA9F06j.js"></script>
  </head>
  <body>
    <div id="appLoader" class="app-loader">
      <div class="app-loader-inner">
        <div class="app-loader-title">SuperDress</div>
        <div class="app-loader-spin" id="appLoaderSpin"></div>
        <!-- Revealed by src/index.ts when the game chunk cannot be fetched
             after its retries. The text lives here, not in the entry: the
             entry must stay tiny and must not pull in the i18n module, and
             this is the one screen shown before any of the game exists. -->
        <div class="app-loader-fail" id="appLoaderFail" hidden>
          <p class="app-loader-fail-text">
            Couldn't load the game. Please check your connection and try again.
          </p>
          <button class="app-loader-fail-btn" type="button" id="appLoaderRetry">
            Reload
          </button>
        </div>
      </div>
    </div>

    <div id="app"></div>

  </body>
