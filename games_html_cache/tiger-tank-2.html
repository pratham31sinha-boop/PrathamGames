<script>
(function() {
  'use strict';
  var noop = function() {};
  var resolvedPromise = function(val) { return Promise.resolve(val); };

  var PokiMock = {
    init: function() { return resolvedPromise(); },
    initWithVideoHB: function() { return resolvedPromise(); },
    commercialBreak: function() { return resolvedPromise(); },
    rewardedBreak: function() { return resolvedPromise(true); },
    displayAd: function(e, t, o, i) {
      if (typeof i === 'function') i(true);
      if (typeof o === 'function') o();
      return resolvedPromise();
    },
    destroyAd: noop,
    getLeaderboard: function() { return resolvedPromise([]); },
    shareableURL: function() { return resolvedPromise(window.location.href); },
    getURLParam: function() { return ''; },
    getLanguage: function() { return (navigator.language || 'en').split('-')[0]; },
    getDeviceInfo: function() { return { category: 'desktop' }; },
    isAdBlocked: function() { return false; },
    getUser: function() { return resolvedPromise({ id: 'pratham_user', name: 'Gamer' }); },
    getToken: function() { return resolvedPromise('pratham_token'); },
    login: function() { return resolvedPromise({ id: 'pratham_user' }); },
    generateScreenshot: function() { return resolvedPromise(''); },
    measure: noop,
    captureError: noop,
    customEvent: noop,
    gameInteractive: noop,
    gameLoadingFinished: noop,
    gameLoadingProgress: noop,
    gameLoadingStart: noop,
    gameplayStart: noop,
    gameplayStop: noop,
    happyTime: noop,
    logError: noop,
    muteAd: noop,
    roundEnd: noop,
    roundStart: noop,
    sendHighscore: noop,
    setDebug: noop,
    setDebugTouchOverlayController: noop,
    setLogging: noop,
    setPlayerAge: noop,
    setPlaytestCanvas: noop,
    enableEventTracking: noop,
    openExternalLink: noop,
    playtestSetCanvas: noop,
    playtestCaptureHtmlOnce: noop,
    playtestCaptureHtmlForce: noop,
    playtestCaptureHtmlOn: noop,
    playtestCaptureHtmlOff: noop,
    movePill: noop,
    showLeaderboard: function() { return resolvedPromise([]); }
  };

  var pokiProxy = new Proxy(PokiMock, {
    get: function(target, prop) {
      if (prop in target) return target[prop];
      return function() { return resolvedPromise(true); };
    }
  });

  try {
    Object.defineProperty(window, 'PokiSDK', {
      value: pokiProxy,
      writable: false,
      configurable: false
    });
  } catch(e) {
    window.PokiSDK = pokiProxy;
  }
})();
</script>

    <script>
        let finshFlag = 0;
        PokiSDK.init().then(() => {
            console.log("Poki SDK successfully initialized");
            loadingFinish();
        });

        function loadingFinish(){
            finshFlag++;
            if( finshFlag == 2){
                PokiSDK.gameLoadingFinished();
            }
        }

        (function() {
            let sm = "horizontal";
            let du = parseInt("2400");
            let ss = performance.now();

            function fit() {
                let flag = 0;
                if (sm == "horizontal")
                    flag = window.innerWidth < window.innerHeight ? 1 : 0;
                else if (sm == "vertical")
                    flag = window.innerWidth > window.innerHeight ? 2 : 0;

                if (flag != 0) {
                    splash.style.width = window.innerHeight + "px";
                    splash.style.height = window.innerWidth + "px";

                    if (flag == 1) {
                        splash.style.transform = "rotate(90deg)";
                        splash.style.left = window.innerWidth;
                    }
                    else {
                        splash.style.transform = "rotate(-90deg)";
                        splash.style.top = window.innerHeight;
                    }
                }
                else {
                    splash.style.transform = "";
                    splash.style.width = "100%";
                    splash.style.height = "100%";
                    splash.style.left = "0px";
                    splash.style.top = "0px";
                }
            }

            function hide() {    
                window.removeEventListener("resize", fit);
                delete window.hideSplashScreen;

                let t = du - (performance.now() - ss);
                if (t < 0) t = 0;
                setTimeout(() => {
                    splash.style.opacity = 0;
                    setTimeout(() => {
                        loadingFinish();
                        splash.parentElement.removeChild(splash)}, 300);
                }, t);
            }

            function onProgress(progress) {
            }

            window.addEventListener("resize", fit);
            window.hideSplashScreen = hide;
            window.onSplashProgress = onProgress;

            fit();
        })();
    </script>
    <script type="text/javascript">
        document.onclick = function(){
            window.focus();
        }

        window.addEventListener('keydown', ev => {
            if (['ArrowDown', 'ArrowUp',' '].includes(ev.key)) {
                ev.preventDefault();
            }
        });
        window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });

        /**
         * 判断设备类型（手机、平板或PC）
         * 通过检测用户代理字符串、触摸功能和屏幕宽度来确定设备类型
         * @returns {string} 返回设备类型：'phone'、'tablet'、'pc' 或 'unknown'
         */
        function getDeviceType() {
            const ua = navigator.userAgent;
            const isTouch = "ontouchend" in document;
            const screenWidth = window.innerWidth;
            const maxTouchPoints = navigator.maxTouchPoints || 1;
            
            // 1. 检测是否为 iPad (包括 iPadOS 桌面模式)
            const isIPad =
                /iPad/.test(ua) ||
                (/(Macintosh|MacIntel)/.test(ua) && isTouch && maxTouchPoints > 1);
            
            // 2. 检测是否为 iPad Pro (额外补充，部分 iPad Pro UA 不含 iPad)
            const isIPadPro =
                /(Macintosh|MacIntel)/.test(ua) &&
                isTouch &&
                maxTouchPoints > 1 &&
                ["Apple", "Apple Inc."].includes(navigator.vendor || "");
            
            // 3. 检测 Android 平板
            const isAndroid = /Android/.test(ua);
            const isAndroidTablet = isAndroid && !/Mobile/.test(ua); // 多数 Android 平板 UA 不含 Mobile
            // 补充：部分 Android 平板 UA 含 Mobile，但屏幕大 + 触摸
            const isPossibleAndroidTablet =
                isAndroid && /Mobile/.test(ua) && screenWidth >= 1024 && isTouch;
            
            // 4. 通用平板判断：触摸设备 + 中等以上屏幕
            const isLikelyTablet =
                isTouch &&
                ((screenWidth >= 768 && screenWidth <= 1024) ||
                (screenWidth >= 1024 && screenHeight >= 1366)); // 适配大屏设备
            
            // 合并平板判断
            const isTablet =
                isIPad ||
                isIPadPro ||
                isAndroidTablet ||
                isPossibleAndroidTablet ||
                (isLikelyTablet && !/iPhone|Android.*Mobile/i.test(ua));
            
            // 手机：移动设备且非平板
            const isPhone =
                /Android|iPhone|Mobile|iPod|BlackBerry|IEMobile|Opera Mini|webOS/i.test(
                ua
                ) && !isTablet;
            
            // PC：非手机非平板
            const isPC = !isPhone && !isTablet;
            
            if (isPhone) return "phone";
            if (isTablet) return "tablet";
            if (isPC) return "pc";
            
            return "unknown";
        }
        window.getDeviceType = getDeviceType;
    </script>
