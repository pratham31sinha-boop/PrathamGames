*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#E8B89D;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
body{display:flex;justify-content:center;align-items:center;}
canvas{display:block;}
#loadingOverlay{

font-family:'mini-wakuwaku',sans-serif;color:#fff;
}
#loadingCard{
width:min(280px,calc(100vw - 64px));display:flex;flex-direction:column;align-items:center;
}
#loadingEggWrap{
width:128px;height:128px;margin-bottom:18px;

background-position:0 0;
filter:drop-shadow(0 6px 0 rgba(0,0,0,.22));
position:relative;transform-origin:center bottom;animation:loadingEggBob 1.15s ease-in-out infinite;
}
.loadingEggFallback{position:absolute;inset:12px;width:104px;height:104px;opacity:1;transition:opacity .1s linear;}
#loadingEggWrap.loading-sprite-ready .loadingEggFallback{opacity:0;}
#loadingEggWrap[data-stage="1"]{background-position:0 0;}
#loadingEggWrap[data-stage="2"]{background-position:0 -128px;}
#loadingEggWrap[data-stage="3"]{background-position:-128px 0;}
#loadingEggWrap[data-stage="4"]{background-position:-128px -128px;}
#loadingEggWrap.is-cracking{animation:loadingEggBob 1.15s ease-in-out infinite,loadingEggCrackHit .34s ease-out;}
#loadingText{
font-size:24px;font-weight:700;letter-spacing:.5px;
text-shadow:0 2px 0 #000,0 4px 0 rgba(0,0,0,.35);
}
#loadingBar{
position:relative;width:100%;height:12px;margin-top:18px;overflow:visible;
background:#C99989;border:3px solid #816162;border-radius:999px;
box-shadow:0 4px 0 rgba(0,0,0,.16);
transform-origin:center center;
}
#loadingBarFill{
position:relative;width:0%;height:100%;overflow:hidden;
background:#BDB692;border-radius:inherit;
box-shadow:inset 0 3px 0 rgba(255,255,255,.22);
transition:width .25s ease-out;
}
#loadingBarFill::before{
content:'';position:absolute;inset:0;
background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);
}
#loadingBarFill::after{
content:'';position:absolute;top:0;bottom:0;width:30px;left:-36px;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
transform:skewX(-16deg);
animation:loadingBarGlint 1.8s ease-in-out infinite;
}
#loadingPct{
position:absolute;left:0;bottom:calc(100% + 9px);display:block;
transform:translateX(-50%);font-size:24px;font-weight:900;line-height:1;white-space:nowrap;color:#FFFFFF;
-webkit-text-stroke:2px #3B271E;paint-order:stroke fill;
text-shadow:0 3px 0 #3B271E,0 6px 0 rgba(59,39,30,.3),0 8px 12px rgba(87,52,38,.24);pointer-events:none;
transition:left .18s ease;
}
@keyframes loadingBarGlint{
0%,28%{left:-36px;opacity:0;}
38%{opacity:1;}
72%{opacity:.75;}
82%,100%{left:calc(100% + 8px);opacity:0;}
}
@keyframes loadingEggBob{
0%,100%{transform:translateY(0) scale(1);}
50%{transform:translateY(-4px) scale(1.03,.98);}
}
@keyframes loadingEggCrackHit{
0%{transform:translateX(0);}
18%{transform:translateX(-4px);}
36%{transform:translateX(4px);}
54%{transform:translateX(-3px);}
72%{transform:translateX(2px);}
100%{transform:translateX(0);}
}
@keyframes loadingEggCrackPop{
0%{transform:translateY(0) scale(1);}
28%{transform:translateY(-7px) scale(1.1,.9);}
55%{transform:translateY(-2px) scale(.96,1.06);}
100%{transform:translateY(0) scale(1);}
}
</style>

let loadingOverlayEl=null,loadingPctEl=null,loadingBarEl=null,loadingBarFillEl=null,loadingEggEl=null,loadingEggStage=1,loadingBarAngle=0,loadingBarNextTiltSign=-1;
function showLoadingOverlay(){
    if(loadingOverlayEl)return;
    let ov=document.getElementById('loadingOverlay');
    if(!ov){
        ov=document.createElement('div');ov.id='loadingOverlay';
        ov.innerHTML=`<div id="loadingCard"><div id="loadingEggWrap" data-stage="1" aria-label="Loading egg" role="img">${LOADING_EGG_FALLBACK_SVG}</div><div id="loadingBar"><div id="loadingBarFill"></div><div id="loadingPct">0%</div></div></div>`;
        document.body.appendChild(ov);
    }
    loadingOverlayEl=ov;
    loadingPctEl=ov.querySelector('#loadingPct');
    loadingBarEl=ov.querySelector('#loadingBar');
    loadingBarFillEl=ov.querySelector('#loadingBarFill');
    loadingEggEl=ov.querySelector('#loadingEggWrap');
    if(loadingEggSpriteReady)loadingEggEl?.classList.add('loading-sprite-ready');
    loadingEggStage=1;
}
function triggerLoadingBarBounce(){
    if(!loadingBarEl?.animate)return;
    const startAngle=loadingBarAngle;
    const angle=loadingBarNextTiltSign*(Math.random()*5);
    loadingBarNextTiltSign*=-1;
    const direction=angle>=startAngle?1:-1;
    const overshoot=Math.max(-5,Math.min(5,angle+direction*1.25));
    loadingBarAngle=angle;
    if(typeof loadingBarEl.getAnimations==='function')loadingBarEl.getAnimations().forEach(anim=>anim.cancel());
    loadingBarEl.style.transform=`rotate(${angle}deg) scale(1)`;
    loadingBarEl.animate([
        {transform:`rotate(${startAngle}deg) scale(1)`},
        {transform:`rotate(${overshoot}deg) scale(1.045)`,offset:.62},
        {transform:`rotate(${angle}deg) scale(1)`}
    ],{duration:520,easing:'cubic-bezier(.22,.9,.3,1)',fill:'none'});
}
function triggerLoadingEggCrackFx(nextStage){
    if(!loadingEggEl||nextStage<=loadingEggStage)return;
    loadingEggStage=nextStage;
    triggerLoadingBarBounce();
    loadingEggEl.classList.remove('is-cracking');
    void loadingEggEl.offsetWidth;
    loadingEggEl.classList.add('is-cracking');
    setTimeout(()=>loadingEggEl?.classList.remove('is-cracking'),360);
}
function setLoadingPercent(p){
    if(!loadingPctEl)return;
    const v=Math.max(0,Math.min(100,Math.round(p)));
    loadingPctEl.textContent=v+'%';
    loadingPctEl.style.left=v+'%';
    if(loadingBarFillEl)loadingBarFillEl.style.width=v+'%';
    if(loadingEggEl){
        const eggIndex=(v<25)?1:(v<50)?2:(v<75)?3:4;
        triggerLoadingEggCrackFx(eggIndex);
        loadingEggEl.setAttribute('data-stage',String(eggIndex));
    }
}
function hideLoadingOverlay(){
    if(!loadingOverlayEl)return;
    loadingOverlayEl.style.transition='opacity .2s ease';
    loadingOverlayEl.style.opacity='0';
    setTimeout(()=>{
        loadingOverlayEl?.remove();
        loadingOverlayEl=null;loadingPctEl=null;loadingBarFillEl=null;loadingEggEl=null;loadingEggStage=1;
    },220);
}

// A boot that throws leaves the loading bar frozen forever. Remember one retry
// per session so a dropped asset costs a reload, not the session.
const BOOT_RETRY_KEY='hm_boot_retry';
function bootRetryUsed(){
    try{return sessionStorage.getItem(BOOT_RETRY_KEY)==='1';}
    catch(e){return true;} // no usable storage: never auto-reload, we cannot count attempts
}
function markBootRetry(){
    try{
        sessionStorage.setItem(BOOT_RETRY_KEY,'1');
        return sessionStorage.getItem(BOOT_RETRY_KEY)==='1';
    }catch(e){return false;}
}
function clearBootRetry(){
    try{sessionStorage.removeItem(BOOT_RETRY_KEY);}catch(e){}
}
function showBootFailure(err){
    console.error('Boot failed:',err);
    const ov=loadingOverlayEl||document.getElementById('loadingOverlay');
    const card=ov?.querySelector('#loadingCard');
    if(!card)return;
    ov.style.pointerEvents='auto'; // the overlay is click-through while loading
    card.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;text-align:center;color:#2A1B0E;font-family:inherit">`
        +`<div style="font-size:18px;font-weight:700">Loading failed</div>`
        +`<div style="font-size:14px;opacity:.8;max-width:280px;line-height:1.4">Some game files could not be downloaded. Check your connection and try again.</div>`
        +`<button type="button" id="bootRetryBtn" style="cursor:pointer;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-size:16px;font-weight:700;color:#2A1B0E;background:#F5C542">Retry</button>`
        +`</div>`;
    card.querySelector('#bootRetryBtn')?.addEventListener('click',()=>{
        clearBootRetry();
        location.reload();
    });
}

// TWEENS
// ============================================================
const tweens=[];
function isLiveDisplayObject(obj){
    return !!obj&&obj.destroyed!==true&&obj._destroyed!==true&&obj.parent!==null;
}
function tw(obj,props,dur,ease,done){
    if(!obj)return null;
    for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];if(t.o===obj){let ov=false;for(const k in props)if(k in t.t){ov=true;break;}if(ov)tweens.splice(i,1);}}
    const t={o:obj,t:{},d:dur,e:0,fn:ease||easeOB,done};
    try{for(const k in props)t.t[k]={f:obj[k],to:props[k]};}
    catch(e){return null;}
    tweens.push(t);return t;
}
function updTw(dt){for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];if(!t.o||t.o.destroyed===true||t.o._destroyed===true){tweens.splice(i,1);continue;}t.e+=dt;const p=Math.min(t.e/t.d,1),v=t.fn(p);try{for(const k in t.t){const{f,to}=t.t[k];t.o[k]=f+(to-f)*v;}}catch(e){tweens.splice(i,1);continue;}if(p>=1){tweens.splice(i,1);if(t.done)t.done();}}}
function easeOB(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function easeOQ(t){return 1-(1-t)*(1-t);}
function easeOC(t){return 1-Math.pow(1-t,3);}
function easeL(t){return t;}
function easeIOQ(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

const parts=[];

function spawnP(con,x,y,col,n,opts){
    const sp=(opts?.speed||6)*UI,life=opts?.life||.5,sz=(opts?.size||3)*UI;
    for(let i=0;i<n;i++){const g=new PIXI.Graphics();g.beginFill(col);g.drawCircle(0,0,1+Math.random()*sz);g.endFill();g.x=x;g.y=y;
    g.vx=(Math.random()-.5)*sp;g.vy=(Math.random()-.5)*sp-sp*.4;g.life=life+Math.random()*.3;g.ml=g.life;con.addChild(g);parts.push(g);}
}
function spawnPullP(con,tx,ty,col,n,radius){
    for(let i=0;i<n;i++){
        const ang=Math.random()*Math.PI*2,dist=radius*.6+Math.random()*radius*.5;

        g.yEnd=vh+140;

function updConfetti(dt){
    const dtSec=dt/60;
    for(let i=confetti.length-1;i>=0;i--){
        const p=confetti[i];
        if(!p||p.destroyed||!p.parent){if(p&&!p.destroyed)p.destroy();confetti.splice(i,1);continue;}
        p.t+=dtSec;
        p.vx*=Math.pow(p.drag,dt);
        p.x+=p.vx*dtSec;
        if(p.t<=p.tUp){
            const k=Math.max(0,Math.min(1,p.t/p.tUp));
            const e=1-Math.pow(1-k,3);
            p.y=p.y0+(p.yPeak-p.y0)*e;
            p.scale.x=p.baseSX;
            p.scale.y=p.baseSY;
        }else{
            const q=Math.max(0,Math.min(1,(p.t-p.tUp)/p.tDown));
            const e=q*q;
            p.y=p.yPeak+(p.yEnd-p.yPeak)*e;
            p.tumble+=p.tumbleSpeed*dt;
            const flip=Math.abs(Math.cos(p.tumble));
            p.scale.x=p.baseSX;
            p.scale.y=p.baseSY*(.28+.72*flip);
        }
        p.rotation+=p.vr*dtSec;
        if(p.y>app.renderer.height/app.renderer.resolution+140||p.t>=p.maxT){
            p.parent?.removeChild(p);p.destroy();confetti.splice(i,1);
        }
    }
    for(const layer of confettiAutoKillLayers){
        if(!layer||layer.destroyed||layer._destroyed){
            confettiAutoKillLayers.delete(layer);
            continue;
        }
        const hasLivePieces=confetti.some(p=>p&&!p.destroyed&&p.parent===layer);
        if(hasLivePieces)continue;
        layer.parent?.removeChild(layer);
        layer.destroy();
        confettiAutoKillLayers.delete(layer);
    }
}

function resolveMergeOutcome(baseTier,aMut,bMut,aVar=-1,bVar=-1){
    if(S.tut.active)return{tier:baseTier,mutated:false,mutVar:-1,chance:0};
    let mutated=false;
    let mutVar=-1;
    let chance=mutationChanceFor(!!aMut,!!bMut);
    if(aMut||bMut){
        mutated=true;
        chance=1;
        if(aMut&&bMut){
            if(aVar>=0&&aVar===bVar){
                mutVar=aVar;
            }else{
                const newVar=pickUndiscoveredMutVar(baseTier,[aVar,bVar]);
                if(newVar>=0)mutVar=newVar;
                else{
                    const parentVars=[aVar,bVar].filter(v=>v>=0);
                    if(parentVars.length)mutVar=parentVars[(Math.random()*parentVars.length)|0];
                    else mutVar=randomMutVar();
                }
            }
        }else if(aMut){
            mutVar=aVar>=0?aVar:randomMutVar();
        }else if(bMut){
            mutVar=bVar>=0?bVar:randomMutVar();
        }
        return{tier:baseTier,mutated,mutVar,chance};
    }
    if(Math.random()<chance)mutated=true;
    if(mutated){

        const livePowerW=isWideViewport()?pDims.w*1.15:pDims.w;
        const btnWScaled=livePowerW*(pDims.scale||1);
        const btnHScaled=wideBottomBtnH()*(pDims.scale||1);
        const rowY=bottomUiY-btnHScaled*.5-6*UI;
        const rowSpacing=btnWScaled+8*UI;
        portraitPowerX1=buyB.x;
        portraitPowerX0=portraitPowerX1-rowSpacing;
        portraitPowerX2=portraitPowerX1+rowSpacing;
        portraitPowerY0=rowY;
        portraitPowerY1=rowY;
        portraitPowerY2=rowY;
        const buyWScaled=(buyB._w||0)*(buyB.scale?.x||buyB._baseScale||1);
        const buyLeftGap=0;
        widePowerX2=buyB.x-buyWScaled*.5-buyLeftGap-btnWScaled*.5;
        widePowerX1=widePowerX2-rowSpacing;
        widePowerX0=widePowerX1-rowSpacing;
        widePowerY0=buyB.y;
        widePowerY1=buyB.y;
        widePowerY2=buyB.y;
    }
    const screenLandscape=isScreenLandscape();
    const livePowerW=(isWideViewport()||screenLandscape)?pDims.w*1.15:pDims.w;
    const livePowerH=(isWideViewport()||screenLandscape)?wideBottomBtnH():pDims.h;
    if(hatchB){relayoutPowerBtn(hatchB,livePowerW,livePowerH);hatchB.x=isWideViewport()?widePowerX0:(isLandscapeLayout?(leftEdgeAnchor+powerBtnInset):portraitPowerX0);hatchB.y=isWideViewport()?widePowerY0:(isLandscapeLayout?powerBtnY0:portraitPowerY0);}
    if(assistB){relayoutPowerBtn(assistB,livePowerW,livePowerH);assistB.x=isWideViewport()?widePowerX1:(isLandscapeLayout?(leftEdgeAnchor+powerBtnInset):portraitPowerX1);assistB.y=isWideViewport()?widePowerY1:(isLandscapeLayout?powerBtnY1:portraitPowerY1);}
    if(speedB){relayoutPowerBtn(speedB,livePowerW,livePowerH);speedB.x=isWideViewport()?widePowerX2:(isLandscapeLayout?(leftEdgeAnchor+powerBtnInset):portraitPowerX2);speedB.y=isWideViewport()?widePowerY2:(isLandscapeLayout?powerBtnY2:portraitPowerY2);}
    if(screenLandscape&&!isContextualTutorialBuy()&&buyB&&hatchB&&assistB&&speedB){
        const rowGap=8*UI;
        const powerW=livePowerW*(pDims.scale||1);
        const powerH=livePowerH*(pDims.scale||1);
        const buyW=(buyB._w||0)*(buyB.scale?.x||buyB._baseScale||1);
        const buyH=(buyB._h||0)*(buyB.scale?.y||buyB._baseScale||1);
        const rowY=bottomUiY-Math.max(powerH,buyH)*.5-6*UI;
        const totalW=powerW*3+buyW+rowGap*3;
        let x0=REF_W*.5-totalW*.5;
        hatchB.x=x0+powerW*.5; hatchB.y=rowY; x0+=powerW+rowGap;
        assistB.x=x0+powerW*.5; assistB.y=rowY; x0+=powerW+rowGap;
        speedB.x=x0+powerW*.5; speedB.y=rowY; x0+=powerW+rowGap;
        buyB.x=x0+buyW*.5; buyB.y=rowY;
        buyB._layoutY=buyB.y;
    }
    for(const btn of [hatchB,assistB,speedB]){
        if(btn)btn._fullPowerSlot={x:btn.x,y:btn.y,w:btn._w,h:btn._h,scale:btn._baseScale||pDims.scale||1};
    }
    layoutPowerButtonStack(false);
    if(luckyB){relayoutPowerBtn(luckyB,pDims.w,pDims.h);luckyB.x=collDialX;luckyB.y=collDialY+collDialR+92*UI;}
    if(luckyArrow){
        if(isLandscapeLayout&&S.luckySpin.active){
            luckyArrow.visible=true;
            setLuckyArrowPos(S.luckySpin.index||0);
        }else luckyArrow.visible=false;
    }
    if(collBg){
        collBg.visible=isCollectionVisible();
        collBg.clear();
        const railW=dexRailWidth(),railX=dexRailLeftX();
        const railY=(isLandscapeLayout||screenLandscape)?0:topUiY;
        const railH=(isLandscapeLayout||screenLandscape)?REF_H:Math.max(1,bottomUiY-topUiY);
        collBg.beginFill(activeBgBaseColor(),.6);
        collBg.drawRect(railX,railY,railW,railH);
        collBg.endFill();
        collBg.beginFill(0xFFFFFF,.15);
        collBg.drawRect(railX,railY,railW,railH);
        collBg.endFill();
    }
    if(collI.length){
        const count=SPECIES.length-1;
        const railTop=56*UI;
        const railBot=REF_H-26*UI;
        const step=Math.max(1,(railBot-railTop)/Math.max(1,count-1));
        const dexIconX=dexIconAnchorX();
        for(let t=1;t<SPECIES.length;t++){
            const ic=collI[t-1];if(!ic)continue;
            ic.visible=isCollectionVisible();
            ic.x=dexIconX;
            ic.y=railTop+step*(t-1);
            ic.scale.set(collBaseIconScale());
        }
    }
    if(collPctTxt){
        collPctTxt.visible=isCollectionVisible();
        collPctTxt.x=dexRailLeftX()+dexRailWidth()*.5;
        collPctTxt.y=16*UI;
    }
    if(collPctCountTxt){
        collPctCountTxt.visible=isCollectionVisible();
        collPctCountTxt.x=dexRailLeftX()+dexRailWidth()*.5;
        collPctCountTxt.y=30*UI;
    }
    const nextBounds=playGridBounds();
    const nextMargin=playGridMargin();
    const boundsStable=canUsePlayBoundsForRemap(nextBounds,nextMargin);
    if(boundsStable&&prevBounds&&(prevBounds.x!==nextBounds.x||prevBounds.y!==nextBounds.y||prevBounds.w!==nextBounds.w||prevBounds.h!==nextBounds.h||prevMargin!==nextMargin)){
        remapStoredPlayPositions(prevBounds,prevMargin,nextBounds,nextMargin);
    }
    if(boundsStable){
        S._playGridBoundsCache={...nextBounds};
        S._playGridMarginCache=nextMargin;
    }
    drawPlayGridOutline();
    updateBoardUsageLabel(false);
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        const pos=gridCellPos(cl,c,r);
        const bg=S.cellBgs[r*COLS+c];
        if(bg){bg.x=pos.x;bg.y=pos.y;}
        if(isLiveDisplayObject(cl?.sprite)&&cl.sprite!==S.drag&&!cl.sprite.spawning&&!cl.merging){
            setNormalTex(cl.sprite,cl.tier,!!cl.mutant,cl.mutVar??-1);
            const sc=gridScale(cl.tier||0);
            const shSc=gridShadowScale(cl.tier||0);
            cl.sprite.scale.set(sc);
            cl.sprite.hitArea=new PIXI.Circle(0,0,cl.tier===0?interactionRadius():dinoPickupRadius(cl.tier,'grid'));
            cl.sprite.x=pos.x;cl.sprite.y=pos.y;
            if(cl.sprite._shadow){
                cl.sprite._shadow.x=pos.x;cl.sprite._shadow.y=pos.y;
                cl.sprite._shadow.visible=true;
                cl.sprite._shadow.alpha=.1;
                cl.sprite._shadow.scale.set(shSc);
            }
            updateDepthByY(cl.sprite,pos.y);
        }
    }
    for(let i=0;i<NEST_COUNT;i++){
        const pos=nPos(i);
        const n=S.nests[i];
        const nbg=S.nestBgs[i];
        if(nbg){nbg.x=pos.x;nbg.y=pos.y;}
        if(n?.basket){
            n.basket.x=pos.x;
            n.basket.y=nestTex?pos.y:(pos.y+cs*.22);
            if(nestTex){
                const bScale=(cs*.92*1.25*nestBasketVisualScale())/nestTex.width;
                n.basketBaseScale=bScale;
            }else{
                n.basketBaseScale=nestBasketVisualScale();
            }
            if(n.basket.scale?.set)n.basket.scale.set(n.basketBaseScale);
        }
        if(n?.basketBack){
            n.basketBack.x=pos.x;
            n.basketBack.y=nestTex?pos.y:(pos.y+cs*.22);
            n.basketBackBaseScale=n.basketBaseScale||n.basketBackBaseScale||1;
            if(n.basketBack.scale?.set)n.basketBack.scale.set(n.basketBackBaseScale,-n.basketBackBaseScale);
        }
        if(n){
            if(n.buildBtn){n.buildBtn.x=pos.x;n.buildBtn.y=pos.y+cs*.4;}
            const barW=cs*.72,barH=12*UI,barX=pos.x+cs*.08,barY=pos.y+cs*.25;
            n.barW=barW;
            if(n.barBg){n.barBg.x=barX;n.barBg.y=barY;}
            if(n.barFill){n.barFill.x=barX;n.barFill.y=barY;}
            if(n.barGlint){n.barGlint.x=barX;n.barGlint.y=barY;}
            if(n.barEgg){n.barEgg.x=barX-barW/2+barH*0.22;n.barEgg.y=barY+barH/2-barH*0.2+4*UI;}
            if(n.barEggOutline){n.barEggOutline.x=barX-barW/2+barH*0.22;n.barEggOutline.y=barY+barH/2-barH*0.2+5*UI;}
            if(n.cntTxt){n.cntTxt.x=barX;n.cntTxt.y=barY+barH/2+4*UI;}
            if(n.warnTxt){n.warnTxt.x=pos.x;n.warnTxt.y=(isLiveDisplayObject(n.sprite)?n.sprite.y:pos.y)-cs*.5;}
            if(isLiveDisplayObject(n.sprite)&&n.sprite!==S.drag&&!n.merging){
                setNormalTex(n.sprite,n.tier,!!n.mutant,n.mutVar??-1);
                const nSc=nestScale(n.tier||0);
                const shSc=nestShadowScale();
                n.sprite.scale.set(nSc*nestFacingSign(i),nSc);
                n.sprite.hitArea=new PIXI.Circle(0,0,dinoPickupRadius(n.tier||0,'nest'));
                n.sprite.x=pos.x;n.sprite.y=pos.y+(n.spriteYOffset||-cs*.1)+nestSpriteVisualYOffset(n.sprite,nestScale(n.tier||0));
                if(n.sprite._shadow){
                    n.sprite._shadow.x=pos.x;n.sprite._shadow.y=pos.y;
                    n.sprite._shadow.visible=true;
                    n.sprite._shadow.alpha=.1;
                    n.sprite._shadow.scale.set(shSc);
                }
            }
            updNestBar(i);
        }
    }
    updateNestUnlockUi();
    updateCaveHumans();
    const sp=sharedNestUiLocalPos();
    const barW=cs*.92,barH=12*UI,iconSize=30*UI;
    if(S.nestShared.barBg){S.nestShared.barBg.x=sp.x;S.nestShared.barBg.y=sp.y;S.nestShared.barW=barW;}
    if(S.nestShared.barFill){S.nestShared.barFill.x=sp.x;S.nestShared.barFill.y=sp.y;}
    if(S.nestShared.barGlint){S.nestShared.barGlint.x=sp.x;S.nestShared.barGlint.y=sp.y;}
    if(S.nestShared.icon){S.nestShared.icon.x=sp.x-barW/2+iconSize*.05;S.nestShared.icon.y=sp.y+barH*.5;}
    if(S.nestShared.iconOutline){S.nestShared.iconOutline.x=sp.x-barW/2+iconSize*.05+1.5*UI;S.nestShared.iconOutline.y=sp.y+barH*.5+1.5*UI;}
    if(S.nestShared.cntTxt){S.nestShared.cntTxt.x=sp.x+4*UI;S.nestShared.cntTxt.y=sp.y+barH/2-2*UI;}
    if(S.nestShared.rewardRow){S.nestShared.rewardRow.x=sp.x;S.nestShared.rewardRow.y=sp.y-10*UI;}
    if(S.nestShared.rewardCoin)sizeSharedNestCoin(S.nestShared.rewardCoin,24*UI);
    updSharedNestBar();
    refreshBgAnchors();
    drawGameBg();
    syncBoosterUnit();
    updateSkyComet();
}

// Resize: scale gameContainer to fit viewport
function resizeGame(){
    computeLayout();
    applyBgColor();
    relayoutScene();
    refreshBgAnchors();
    updateSkyComet();
    if(buyB||hatchB||assistB||speedB||luckyB)updAllBtns();
    const vw=app.renderer.width/app.renderer.resolution;
    const vh=app.renderer.height/app.renderer.resolution;
    const contentW=Math.max(1,REF_W);
    const contentH=Math.max(1,REF_H);
    const fitW=vw/contentW;
    const fitH=vh/contentH;
    const scale=Math.min(fitW,fitH);
    gameContainer.scale.set(scale);
    gameContainer.x=(vw-contentW*scale)/2;
    gameContainer.y=(vh-contentH*scale)/2;
    gameContainer._baseX=gameContainer.x;
    gameContainer._baseY=gameContainer.y;
    app.stage.hitArea=new PIXI.Rectangle(0,0,vw,vh);
}
resizeGame();
applyBgColor();

function boardDefaultTopY(){
    const b=playGridBounds();
    const boardH=LAYOUT_ROWS*cs+(LAYOUT_ROWS-1)*CELL_GAP;
    return b.y+Math.max(0,(b.h-boardH)/2);
}
function cPos(c,r){return{x:gX+c*(cs+CELL_GAP)+cs/2,y:boardDefaultTopY()+r*(cs+CELL_GAP)+cs/2};}
function isWideViewport(){
    return false;
}
function isScreenLandscape(){
    const vw=(app?.renderer?.width?app.renderer.width/app.renderer.resolution:window.innerWidth);
    const vh=(app?.renderer?.height?app.renderer.height/app.renderer.resolution:window.innerHeight);
    return vw>vh;
}
function mainGameplayElementScale(){
    return !SOFT_RELEASE_GAMEPLAY&&isScreenLandscape()?LANDSCAPE_MAIN_ELEMENT_SCALE:1;
}
function portraitTallExtraUi(basePerRatio){
    const vw=(app?.renderer?.width?app.renderer.width/app.renderer.resolution:window.innerWidth);
    const vh=(app?.renderer?.height?app.renderer.height/app.renderer.resolution:window.innerHeight);
    const ratio=vh/Math.max(1,vw);
    const extra=Math.max(0,ratio-(16/9));
    return 2*(Math.exp(extra)-1)*basePerRatio*UI;
}
function meteorPlayNestYOffset(){return METEOR_PLAY?cs*1.25:0;}
function meteorPlayPlayTopYOffset(){return METEOR_PLAY?cs*1:0;}
function meteorPlayBgTopYOffset(){return METEOR_PLAY?cs*.9:0;}
function portraitPlayAreaTopBaseY(){
    const baseY=nestRowY+cs/2;
    const topUiY=uiL.toLocal(new PIXI.Point(0,0),app.stage).y;
    const anchoredY=topUiY+baseY;
    const py=playArea?.y||0;
    const ps=playArea?.scale?.y||1;
    return ((anchoredY-py)/Math.max(.0001,ps))+(cs*.28+portraitTallExtraUi(45));
}
function nestGap(){
    if(isWideViewport())return CELL_GAP*3.25;
    const portraitGap=CELL_GAP*1.5;
    return isScreenLandscape()
        ? (cs+portraitGap)*mainGameplayElementScale()-cs
        : portraitGap;
}
function landscapePlayTop(){
    const topUiY=uiL.toLocal(new PIXI.Point(0,0),app.stage).y;
    return uiPointToPlay(0,topUiY+66*UI).y;
}
function landscapePlayBottom(){
    const buyHalfH=((buyB?._h||BTN_H)*((buyB?._baseScale)||playScale||1))*.5;
    return buyB?uiPointToPlay(buyB.x,buyB.y-buyHalfH-14*UI).y:(buyBtnY-buyHalfH-14*UI);
}
function widePlayGridBoundsWide(){
    const top=landscapePlayTop()+(ageHasNests()?110*UI:0)+meteorPlayPlayTopYOffset();
    const buyHalfH=((buyB?._h||BTN_H)*((buyB?.scale?.y)||playScale||1))*.5;
    const liveBuyBottom=landscapePlayBottom();
    const bottom=Math.max(top+1,liveBuyBottom);
    const sideInset=6*UI;
    const leftEdgeX=playArea.toLocal(new PIXI.Point(0,0),app.stage).x;
    const baseNestX=leftEdgeX+cs*3;
    const leftUiBound=baseNestX+cs*1.08+4*UI;
    const rightUiBound=collBg?uiPointToPlay(dexRailLeftX(),0).x-54*UI:0;
    let leftBound=leftUiBound+sideInset;
    let rightBound=rightUiBound-sideInset;
    const availW=Math.max(1,rightBound-leftBound);
    const useW=Math.min(availW,WIDE_PLAYAREA_MAX_WIDTH);
    const midX=(leftBound+rightBound)*.5;
    return{
        x:midX-useW*.5,
        y:top,
        w:useW,
        h:Math.max(1,bottom-top)
    };
}
function wideNestColumnX(){
    const b=widePlayGridBoundsWide();
    return b.x-cs*1.08-20*UI;
}
function nestDinoBaseScale(){return 1.6*mainGameplayElementScale();}
function nestShadowScale(){
    return nestDinoBaseScale()*.5;
}
function nestBasketVisualScale(){return mainGameplayElementScale();}
function nestAreaYOffset(){return (isWideViewport()?cs*.35:(cs*.28+portraitTallExtraUi(45)))+meteorPlayNestYOffset();}
function nPos(i){
    if(isWideViewport()){
        const colX=wideNestColumnX();
        const stackGap=cs+CELL_GAP*2.05;
        const stackCenterY=(landscapePlayTop()+landscapePlayBottom())*.5+cs*.7-CELL_GAP*1.5+nestAreaYOffset();
        const y=stackCenterY+(i-(NEST_COUNT-1)*.5)*stackGap;
        return{x:colX,y};
    }
    const gap=nestGap();
    const nestSpan=cs*NEST_COUNT+gap*(NEST_COUNT-1);
    const startX=gX+(totalGridW-nestSpan)*.5;
    const x=startX+i*(cs+gap)+cs/2;
    const baseY=nestRowY+cs/2;
    const topUiY=uiL.toLocal(new PIXI.Point(0,0),app.stage).y;
    const anchoredY=topUiY+baseY;
    const py=playArea?.y||0;
    const ps=playArea?.scale?.y||1;
    return{x,y:((anchoredY-py)/Math.max(.0001,ps))+nestAreaYOffset()};
}
function nestHitRect(i){
    const pos=nPos(i);
    const elementScale=mainGameplayElementScale();
    const withEdgeSidePadding=(r)=>{
        const sidePad=cs*.45*elementScale;
        if(i===0){r.x-=sidePad;r.w+=sidePad;}
        if(i===NEST_COUNT-1){r.w+=sidePad;}
        return r;
    };
    if(isWideViewport()){
        return withEdgeSidePadding({
            x:pos.x-cs*.82*elementScale,
            y:pos.y-cs*.72*elementScale,
            w:cs*1.64*elementScale,
            h:cs*1.48*elementScale
        });
    }
    const gap=nestGap();
    const hitW=(cs+gap)*elementScale;
    const hitH=(cs*1.5+CELL_GAP*.5)*elementScale;
    return withEdgeSidePadding({
        x:pos.x-hitW*.5,
        y:pos.y-cs*elementScale,
        w:hitW,
        h:hitH
    });
}
function findNestHitIndex(px,py){
    let best=-1,bestDist=Infinity;
    for(let i=0;i<NEST_COUNT;i++){
        if(!isNestPurchased(i))continue;
        const r=nestHitRect(i);
        if(px<r.x||px>r.x+r.w||py<r.y||py>r.y+r.h)continue;
        const pos=nPos(i);
        const dist=Math.hypot(px-pos.x,py-pos.y);
        if(dist<bestDist){best=i;bestDist=dist;}
    }
    return best;
}
function uiPointToPlay(x,y){
    const gp=uiL.toGlobal(new PIXI.Point(x,y));
    return playArea.toLocal(gp);
}
function playGridBounds(){
    const vw=(app?.renderer?.width?app.renderer.width/app.renderer.resolution:window.innerWidth);
    const vh=(app?.renderer?.height?app.renderer.height/app.renderer.resolution:window.innerHeight);
    const wideViewport=isWideViewport();
    const top=wideViewport
        ?(landscapePlayTop()+(ageHasNests()?110*UI:0)+meteorPlayPlayTopYOffset())
        :(ageHasNests()
            ?((METEOR_PLAY?(portraitPlayAreaTopBaseY()+meteorPlayPlayTopYOffset()):nPos(0).y)+cs*1.08)
            :portraitPlayAreaTopBaseY());
    const buyHalfH=((buyB?._h||BTN_H)*((buyB?.scale?.y)||playScale||1))*.5;
    const liveBuyBottom=wideViewport?landscapePlayBottom():(buyB?uiPointToPlay(buyB.x,buyB.y-buyHalfH-10*UI).y:(buyBtnY-buyHalfH-10*UI));
    const bottom=Math.max(top+1,liveBuyBottom);
    const sideInset=wideViewport?6*UI:4*UI;
    const railInset=collBg?(REF_W-uiPointToPlay(dexRailLeftX(),0).x):0;
    const symmetricInset=Math.max(sideInset,railInset+10*UI);
    if(wideViewport){
        return widePlayGridBoundsWide();
    }
    const leftBound=symmetricInset;
    const rightBound=REF_W-symmetricInset;
    return{
        x:leftBound,
        y:top,
        w:Math.max(1,rightBound-leftBound),
        h:Math.max(1,bottom-top)
    };
}
function playGridMargin(){
    return cs*.5*mainGameplayElementScale();
}
function normalizePlayPos(px,py,bounds=playGridBounds(),margin=playGridMargin()){
    const innerW=Math.max(1,bounds.w-margin*2);
    const innerH=Math.max(1,bounds.h-margin*2);
    return{
        rx:(px-(bounds.x+margin))/innerW,
        ry:(py-(bounds.y+margin))/innerH
    };
}
function denormalizePlayPos(rx,ry,bounds=playGridBounds(),margin=playGridMargin()){
    const innerW=Math.max(1,bounds.w-margin*2);
    const innerH=Math.max(1,bounds.h-margin*2);
    return clampToPlayGrid(bounds.x+margin+rx*innerW,bounds.y+margin+ry*innerH,margin);
}
function canUsePlayBoundsForRemap(bounds,margin=playGridMargin()){
    if(!bounds)return false;
    const innerW=bounds.w-margin*2;
    const innerH=bounds.h-margin*2;
    return innerW>=cs*1.5&&innerH>=cs*2;
}
function remapStoredPlayPositions(prevBounds,prevMargin,nextBounds,nextMargin){
    if(!HIDDEN_GRID_PRESENTATION||!prevBounds)return;
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        if(!cl||cl.reserved||typeof cl.px!=='number'||typeof cl.py!=='number')continue;
        const n=normalizePlayPos(cl.px,cl.py,prevBounds,prevMargin);
        const p=denormalizePlayPos(n.rx,n.ry,nextBounds,nextMargin);
        cl.px=p.x;cl.py=p.y;
    }
}
function clampToPlayGrid(px,py,margin=cs*.5){
    const b=playGridBounds();
    return{
        x:Math.max(b.x+margin,Math.min(b.x+b.w-margin,px)),
        y:Math.max(b.y+margin,Math.min(b.y+b.h-margin,py))
    };
}
function pointInPlayGrid(px,py,margin=0){
    const b=playGridBounds();
    return px>=b.x+margin&&px<=b.x+b.w-margin&&py>=b.y+margin&&py<=b.y+b.h-margin;
}
function gridCellPos(cell,c,row){
    return(cell&&typeof cell.px==='number'&&typeof cell.py==='number')?{x:cell.px,y:cell.py}:cPos(c,row);
}
function cellClearanceRadius(){
    return cs*.82*mainGameplayElementScale();
}
function interactionRadius(){
    return cellClearanceRadius()*.5;
}
function dinoPickupRadius(tier,location='grid'){
    const worldRadius=interactionRadius();
    if(!isScreenLandscape()||tier<1)return worldRadius;
    const visualScale=location==='nest'?nestScale(tier):gridScale(tier);
    return worldRadius/Math.max(.0001,Math.abs(visualScale));
}
function dinoPickupLocalCenterY(spr,tier){
    return 0;
}
function pickupRadiusDebugForSprite(spr,tier,location='grid'){
    return isScreenLandscape()&&tier>=1?interactionRadius():(tier===0?interactionRadius():dinoPickupRadius(tier,location));
}
function mergeHoverRadius(){
    return interactionRadius()*1.3;
}
function mergeRadiusForEntity(tier){

function overlapsPlayOccupant(px,py,exclude){

        if(!cl||cl.reserved||!isLiveDisplayObject(cl.sprite)||cl.sprite===exclude)continue;

        if(cl.merging){
            positions.push({x:cl.sprite.x,y:cl.sprite.y});
            if(cl.mergeTargetPos)positions.push(cl.mergeTargetPos);
        }
        for(const pos of positions){

function makePlaySpaceForPendingSpawn(){
    if(!HIDDEN_GRID_PRESENTATION)return null;
    const occupants=[];
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        if(!cl||cl.reserved||!isLiveDisplayObject(cl.sprite))continue;
        const pos=gridCellPos(cl,c,r);
        occupants.push({cl,x:pos.x,y:pos.y});
    }
    const b=playGridBounds(),margin=playGridMargin();
    const minX=b.x+margin,maxX=b.x+b.w-margin,minY=b.y+margin,maxY=b.y+b.h-margin;
    const clearance=cellClearanceRadius();
    const rawCandidates=eggFormationCandidates(null,'buy');
    const candidates=[];
    for(const pos of rawCandidates){
        if(candidates.some(p=>Math.hypot(p.x-pos.x,p.y-pos.y)<1))continue;
        candidates.push(pos);
    }
    const solve=(spawn,candidateIndex)=>{
        const nodes=[
            {x:spawn.x,y:spawn.y,ox:spawn.x,oy:spawn.y,fixed:true,active:true},
            ...occupants.map(entry=>({entry,x:entry.x,y:entry.y,ox:entry.x,oy:entry.y,fixed:false,active:false}))
        ];
        for(let iter=0;iter<160;iter++){
            let adjusted=false;
            for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
                const a=nodes[i],d=nodes[j];
                if(!a.active&&!d.active)continue;
                let dx=d.x-a.x,dy=d.y-a.y;
                let dist=Math.hypot(dx,dy);
                if(dist>=clearance)continue;
                if(dist<.001){
                    const angle=((i+1)*2.399963+(j+1)*1.618034+candidateIndex*.73)%(Math.PI*2);
                    dx=Math.cos(angle);dy=Math.sin(angle);dist=0;
                }else{
                    dx/=dist;dy/=dist;
                }
                const push=clearance-dist+.08;
                if(a.fixed){
                    d.x+=dx*push;d.y+=dy*push;d.active=true;
                }else if(d.fixed){
                    a.x-=dx*push;a.y-=dy*push;a.active=true;
                }else{
                    a.x-=dx*push*.5;a.y-=dy*push*.5;
                    d.x+=dx*push*.5;d.y+=dy*push*.5;
                    a.active=true;d.active=true;
                }
                if(!a.fixed){a.x=Math.max(minX,Math.min(maxX,a.x));a.y=Math.max(minY,Math.min(maxY,a.y));}
                if(!d.fixed){d.x=Math.max(minX,Math.min(maxX,d.x));d.y=Math.max(minY,Math.min(maxY,d.y));}
                adjusted=true;
            }
            if(!adjusted)break;
        }
        let unresolved=0,maxOverlap=0,movement=0,movedCount=0;
        for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
            if(!nodes[i].active&&!nodes[j].active)continue;
            const overlap=Math.max(0,clearance-Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y));
            unresolved+=overlap*overlap;
            maxOverlap=Math.max(maxOverlap,overlap);
        }
        for(let i=1;i<nodes.length;i++){
            const node=nodes[i];
            const delta=Math.hypot(node.x-node.ox,node.y-node.oy);
            movement+=delta*delta;
            if(delta>.5)movedCount++;
        }
        return{spawn,nodes,valid:maxOverlap<=.001,score:unresolved*1e7+movement+movedCount*clearance*.08+candidateIndex*.01};
    };
    let best=null;
    for(let i=0;i<candidates.length;i++){
        const result=solve(candidates[i],i);
        if(!result.valid)continue;
        if(!best||result.score<best.score)best=result;
    }
    if(!best)return null;
    for(let i=1;i<best.nodes.length;i++){
        const node=best.nodes[i];
        if(Math.hypot(node.x-node.ox,node.y-node.oy)<=.5)continue;
        tw(node.entry.cl,{px:node.x,py:node.y},10,easeOQ);
    }
    return best.spawn;
}
function nearestOccupantDistance(px,py,exclude){
    let best=Infinity;
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        if(!cl||cl.reserved||!isLiveDisplayObject(cl.sprite)||cl.sprite===exclude)continue;
        const positions=[gridCellPos(cl,c,r)];
        if(cl.merging){
            positions.push({x:cl.sprite.x,y:cl.sprite.y});
            if(cl.mergeTargetPos)positions.push(cl.mergeTargetPos);
        }
        for(const pos of positions){
            const d=Math.hypot(pos.x-px,pos.y-py);
            if(d<best)best=d;
        }
    }
    return best;
}
function scoreEggSpawnPos(px,py,sourcePos,mode='generic'){
    const b=playGridBounds();
    const margin=playGridMargin();
    const centerX=b.x+b.w*.5,centerY=b.y+b.h*.5;
    const edgeDist=Math.min(px-(b.x+margin),(b.x+b.w-margin)-px,py-(b.y+margin),(b.y+b.h-margin)-py);
    const nearest=nearestOccupantDistance(px,py,null);
    const fromSource=sourcePos?Math.hypot(px-sourcePos.x,py-sourcePos.y):0;
    const centerBias=Math.hypot(px-centerX,py-centerY);
    let score=0;
    if(Number.isFinite(nearest)){
        const ideal=cellClearanceRadius()*(isWideViewport()?1.45:1.22);
        score-=Math.abs(nearest-ideal)*1.1;
        score+=Math.max(0,nearest-cellClearanceRadius())*.12;
    }else{
        score+=18;
    }
    score+=Math.max(0,edgeDist)*.18;
    if(mode==='buy'){
        const targetY=b.y+b.h*.72;
        score-=Math.abs(py-targetY)*.22;
        score-=Math.abs(px-centerX)*.08;
        score-=fromSource*.015;
    }else if(mode==='nest'){
        score-=fromSource*.02;
        score-=centerBias*.035;
    }else{
        score-=centerBias*.03;
    }
    score+=Math.random()*6;
    return score;
}
function eggFormationCandidates(sourcePos,mode='generic'){
    const b=playGridBounds();
    const margin=playGridMargin();
    const centerX=b.x+b.w*.5;
    const bottomY=b.y+b.h*.76;
    const topY=b.y+b.h*.24;
    const wideMul=isWideViewport()?2:1;
    const push=(arr,x,y)=>arr.push(clampToPlayGrid(x,y,margin));
    const out=[];
    if(mode==='buy'){
        const dx=cs*.72*wideMul,dy=cs*.62*wideMul;
        push(out,centerX,bottomY);
        push(out,centerX-dx,bottomY);
        push(out,centerX+dx,bottomY);
        push(out,centerX-dx*2,bottomY);
        push(out,centerX+dx*2,bottomY);
        push(out,centerX,bottomY-dy);
        push(out,centerX-dx*.8,bottomY-dy);
        push(out,centerX+dx*.8,bottomY-dy);
        push(out,centerX,bottomY-dy*2);
        return out;
    }
    if(mode==='nest'){
        const baseX=Math.max(b.x+margin,Math.min(b.x+b.w-margin,sourcePos?.x??centerX));
        const dx=cs*.62*wideMul,dy=cs*.58*wideMul;
        push(out,baseX,topY);
        push(out,baseX-dx,topY+dy*.2);
        push(out,baseX+dx,topY+dy*.2);
        push(out,baseX-dx*2,topY+dy*.45);
        push(out,baseX+dx*2,topY+dy*.45);
        push(out,baseX,topY+dy);
        push(out,baseX-dx*.8,topY+dy*1.1);
        push(out,baseX+dx*.8,topY+dy*1.1);
        push(out,baseX,topY+dy*2);
        return out;
    }
    push(out,centerX,b.y+b.h*.5);
    return out;
}
function findScoredEggSpawnPos(sourcePos,mode='generic'){
    const formation=eggFormationCandidates(sourcePos,mode);
    for(const p of formation){
        if(!overlapsPlayOccupant(p.x,p.y,null))return p;
    }
    const b=playGridBounds();
    const margin=playGridMargin();
    const minX=b.x+margin,maxX=b.x+b.w-margin,minY=b.y+margin,maxY=b.y+b.h-margin;
    let best=null,bestScore=-Infinity;
    for(let i=0;i<36;i++){
        const px=minX+Math.random()*(maxX-minX);
        const py=minY+Math.random()*(maxY-minY);
        if(overlapsPlayOccupant(px,py,null))continue;
        const score=scoreEggSpawnPos(px,py,sourcePos,mode);

    return findFreePlayPos(null);
}

function hitTest(px,py,excludeSprite=null){
    const ni=findNestHitIndex(px,py);
    if(ni>=0)return{type:'nest',index:ni};
    let best=null,bestDist=interactionRadius();
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        if(!cl||cl.reserved||!cl.sprite||cl.sprite===excludeSprite)continue;
        const pos=gridCellPos(cl,c,r);
        const d=Math.hypot(pos.x-px,pos.y-py);
        if(d<bestDist){bestDist=d;best={type:'grid',col:c,row:r};}
    }
    if(best)return best;
    if(!HIDDEN_GRID_PRESENTATION&&pointInPlayGrid(px,py,cs*.4)){
        let bestCell=null,bestCellDist=Infinity;
        for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
            const pos=cPos(c,r);
            const d=Math.hypot(pos.x-px,pos.y-py);
            if(d<bestCellDist){bestCellDist=d;bestCell={type:'grid',col:c,row:r};}
        }
        if(bestCell&&bestCellDist<=Math.max(cs*.7,(cs+CELL_GAP)*.5))return bestCell;
    }
    if(pointInPlayGrid(px,py,cs*.4)){
        return{type:'free',x:px,y:py};
    }
    return null;
}

function encodeWavFromChannels(channels,sampleRate){
    const numChannels=Math.max(1,channels.length|0);
    const length=channels[0]?.length||0;
    const bytesPerSample=2;
    const blockAlign=numChannels*bytesPerSample;
    const buffer=new ArrayBuffer(44+length*blockAlign);
    const view=new DataView(buffer);
    const writeStr=(off,str)=>{for(let i=0;i<str.length;i++)view.setUint8(off+i,str.charCodeAt(i));};
    writeStr(0,'RIFF');
    view.setUint32(4,36+length*blockAlign,true);
    writeStr(8,'WAVE');
    writeStr(12,'fmt ');
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,numChannels,true);
    view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*blockAlign,true);
    view.setUint16(32,blockAlign,true);
    view.setUint16(34,16,true);
    writeStr(36,'data');
    view.setUint32(40,length*blockAlign,true);
    let off=44;
    for(let i=0;i<length;i++){
        for(let ch=0;ch<numChannels;ch++){
            const s=Math.max(-1,Math.min(1,channels[ch]?.[i]||0));
            view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);
            off+=2;
        }
    }
    return new Blob([buffer],{type:'audio/wav'});
}
async function cleanDexVoiceBlob(blob){
    try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const arr=await blob.arrayBuffer();
        const audio=await ctx.decodeAudioData(arr.slice(0));
        const channels=[];
        const frames=audio.length|0;
        let start=frames,end=-1,peak=0;
        for(let ch=0;ch<audio.numberOfChannels;ch++)channels.push(audio.getChannelData(ch));
        for(let i=0;i<frames;i++){
            let amp=0;
            for(let ch=0;ch<channels.length;ch++)amp=Math.max(amp,Math.abs(channels[ch][i]||0));
            if(amp>DEX_VOICE_TRIM_THRESHOLD){
                if(i<start)start=i;
                end=i;
            }
            if(amp>peak)peak=amp;
        }
        if(end<start){
            try{await ctx.close();}catch(e){}
            return blob;
        }
        const pad=Math.max(1,Math.round(audio.sampleRate*0.02));
        start=Math.max(0,start-pad);
        end=Math.min(frames-1,end+pad);
        const outLen=Math.max(1,end-start+1);
        let outPeak=0;
        const outChannels=[];
        for(let ch=0;ch<channels.length;ch++){
            const src=channels[ch];
            const out=new Float32Array(outLen);
            for(let i=0;i<outLen;i++){
                let v=src[start+i]||0;
                if(Math.abs(v)<DEX_VOICE_GATE_THRESHOLD)v=0;
                out[i]=v;
                const av=Math.abs(v);
                if(av>outPeak)outPeak=av;
            }
            outChannels.push(out);
        }
        if(outPeak>0){
            const gain=Math.min(4,DEX_VOICE_PEAK_TARGET/outPeak);
            for(const out of outChannels)for(let i=0;i<out.length;i++)out[i]*=gain;
        }
        const wav=encodeWavFromChannels(outChannels,audio.sampleRate);
        try{await ctx.close();}catch(e){}
        return wav;
    }catch(e){
        return blob;
    }
}

// Retry deferred images once so a transient reload/cache abort does not leave
// a visual missing for the rest of the session.
async function tryLoad(path,attempts=2){
    let lastError=null;
    for(let attempt=0;attempt<attempts;attempt++){
        try{return await PIXI.Assets.load(path);}
        catch(e){
            lastError=e;
            if(attempt+1<attempts)await new Promise(resolve=>setTimeout(resolve,180*(attempt+1)));
        }
    }
    console.warn('Texture load failed:',path,lastError);
    return null;
}

// Retry the atlas descriptor as well as its image: one dropped request on a
// flaky connection used to leave the startup atlas empty and hard-fail the boot.
async function fetchAtlasJson(jsonPath,attempts=3){
    let lastError=null;
    for(let attempt=0;attempt<attempts;attempt++){
        try{
            const r=await fetch(jsonPath,attempt?{cache:'reload'}:undefined);
            if(!r.ok)throw new Error(`HTTP ${r.status} ${r.statusText}`);
            return await r.json();
        }catch(e){
            lastError=e;
            if(attempt+1<attempts)await new Promise(resolve=>setTimeout(resolve,180*(attempt+1)));
        }
    }
    throw lastError||new Error(`Atlas JSON load failed: ${jsonPath}`);
}

// Load spritesheet: image + custom JSON array → map of name→PIXI.Texture
async function loadSheetAtlas(imagePath,jsonPath,attempts=3){
    try{
        const usesZooFallback=((ZOO_GAMEPLAY&&(imagePath===BASE_SHEET_ATLAS.image||imagePath===OPEN_SHEET_ATLAS.image)))||imagePath===ZOO_SILHOUETTE_ATLAS.image;
        const basePromise=tryLoad(imagePath,attempts);
        const inlineData=ATLAS_JSON_INLINE[jsonPath]||null;
        const dataPromise=(usesZooFallback||inlineData)?null:fetchAtlasJson(jsonPath,attempts);
        const [baseTex,jsonData]=await Promise.all([basePromise,dataPromise]);
        if(!baseTex)throw new Error(`Atlas image load failed: ${imagePath}`);
        const resp=usesZooFallback?zooDinoAtlasRects(baseTex):(inlineData||jsonData);
        if(imagePath===SHEET_IMAGE)spritesheetBaseTex=baseTex;
        const frames={};
        for(const f of resp){
            const rect=new PIXI.Rectangle(f.x,f.y,f.width,f.height);
            frames[f.name]=new PIXI.Texture(baseTex.baseTexture||baseTex,rect);
        }
        console.log('Spritesheet atlas loaded:',jsonPath,Object.keys(frames).length,'frames');
        return frames;
    }catch(e){console.warn('Spritesheet atlas load failed:',jsonPath,e);return{};}
}

async function loadSheet(onProgress=null,includeExtras=true){
    const extraAtlases=(includeExtras&&USE_MUTANT_TEXTURES)?EXTRA_SHEET_ATLASES:[];
    const atlases=[{image:SHEET_IMAGE,json:SHEET_JSON},BASE_SHEET_ATLAS,...extraAtlases];
    const frames={};
    let completed=0;
    const loaded=await Promise.all(atlases.map(async(a)=>{
        const atlasFrames=await loadSheetAtlas(a.image,a.json);
        completed++;
        onProgress?.(completed/Math.max(1,atlases.length));
        return atlasFrames;
    }));
    for(const atlasFrames of loaded)Object.assign(frames,atlasFrames);
    const mutantNumber=mutantAgeNumber();
    if(mutantNumber){
        for(let tier=1;tier<SPECIES.length;tier++){
            const selected=loaded[1]?.[`thing_${tier}_mutant_${mutantNumber}`];
            if(selected)frames[`thing_${tier}`]=selected;

    console.log('Spritesheet loaded total:',Object.keys(frames).length,'frames');
    return frames;
}

}

// Resize texture to fit maxDim (renders to new texture at correct display size)
// Make a texture report a maxDim x maxDim size (what all sprite scaling expects) while still sampling
// the full-resolution atlas frame. Baking a small copy instead made dinos jagged (4x one-pass shrink)
// and then blurry (stretched back up on high-DPI screens). Mipmaps let the GPU shrink it smoothly.
function enableAtlasMipmaps(baseTexture){
    if(!baseTexture||baseTexture.mipmap===PIXI.MIPMAP_MODES.ON)return;
    baseTexture.mipmap=PIXI.MIPMAP_MODES.ON; // generated on WebGL2 (all modern browsers); ignored on WebGL1
    baseTexture.update();
}
function fitTex(tex,maxDim){
    if(!tex||tex.width<=maxDim)return tex;
    const w=tex.width,h=tex.height,s=maxDim/Math.max(w,h);
    // Centre the frame in a square maxDim box, like the old baked version did.
    const ox=(maxDim-w*s)/2,oy=(maxDim-h*s)/2;
    const tr=tex.trim;
    const trim=tr
        ? new PIXI.Rectangle(ox+tr.x*s,oy+tr.y*s,tr.width*s,tr.height*s)
        : new PIXI.Rectangle(ox,oy,w*s,h*s);
    enableAtlasMipmaps(tex.baseTexture);
    return new PIXI.Texture(tex.baseTexture,tex.frame.clone(),new PIXI.Rectangle(0,0,maxDim,maxDim),trim,tex.rotate);
}

async function loadBgSceneProgressively(path=currentBgScenePath()){
    const loadId=++bgSceneLoadId;
    const sceneTex=await tryLoad(path);
    if(!sceneTex||loadId!==bgSceneLoadId||path!==currentBgScenePath())return;
    bgSceneTex=sceneTex;
    bgScenePath=path;
    buildBgSceneSlices();
    bgSceneActivated=false;
    drawGameBg();
    const sceneLayers=[gameBgTopSpr,gameBgRiverSpr,gameBgRiverBaseSpr,gameBgRiverBaseFill,gameBgBottomSpr,gameBgSky].filter(Boolean);
    for(const layer of sceneLayers)layer.alpha=0;
    let activated=false;
    const finishFade=()=>{
        if(activated||loadId!==bgSceneLoadId)return;
        activated=true;
        for(const layer of sceneLayers){
            if(layer&&!layer.destroyed&&!layer._destroyed)layer.alpha=1;
        }
        bgSceneActivated=true;
        applyBgColor();
    };
    if(sceneLayers.length){
        let remaining=sceneLayers.length;
        for(const layer of sceneLayers)tw(layer,{alpha:1},30,easeOQ,()=>{
            remaining--;
            if(remaining===0)finishFade();
        });
        // Tween callbacks can be displaced by layout/mode changes. Always settle
        // the scene so a deferred background can never remain transparent.
        setTimeout(finishFade,750);
    }else finishFade();
}

function exhibitVisitorCountForTier(tier){

function exhibitVisitorSpawnOrigin(){

    for(let i=0;i<NEST_COUNT;i++){
        const p=nPos(i);
        if(p.x<minX)minX=p.x;

    }
    if(!Number.isFinite(minX)||!Number.isFinite(maxX)||!Number.isFinite(maxY)){
        const first=nPos(0);
        return {x:first.x,y:first.y+cs*1.1};
    }
    return {
        x:(minX+maxX)*.5,

    };
}
function exhibitVisitorArea(nestIndex){

function repickExhibitVisitorTarget(v){
    const area=exhibitVisitorArea(v.nestIndex);
    const t=(v.localIndex%Math.max(1,EXHIBIT_VISITOR_PER_NEST-1))/Math.max(1,EXHIBIT_VISITOR_PER_NEST-1);
    const arc=(Math.PI*.85)+t*(Math.PI*1.1);
    const rx=area.rx*(.55+Math.random()*.45);
    const ry=area.ry*(.55+Math.random()*.45);
    const jitterX=(Math.random()-.5)*cs*.10;
    const jitterY=(Math.random()-.5)*cs*.08;
    v.tx=area.cx+Math.cos(arc)*rx+jitterX;
    v.ty=area.cy+Math.sin(arc)*ry+jitterY;
    v.speed=.75+Math.random()*.55;
}
function updateExhibitVisitors(dt=0){
    ensureExhibitVisitors();
    if(!SHOW_CAVE_HUMANS||!ZOO_GAMEPLAY){
        for(const v of S.exhibitVisitors){
            v.active=false;v.phase='idle';v.alpha=0;
            if(v.marker)v.marker.visible=false;
        }
        return;
    }
    const desired=new Array(S.exhibitVisitors.length).fill(null);
    for(let ni=0;ni<NEST_COUNT;ni++){
        const n=S.nests[ni];
        if(!n||n.tier<1||n.merging)continue;
        const count=exhibitVisitorCountForTier(n.tier);
        for(let li=0;li<count;li++){
            const idx=ni*EXHIBIT_VISITOR_PER_NEST+li;
            desired[idx]={nestIndex:ni,localIndex:li};
        }
    }
    const stepBase=(dt/60)||0;
    for(let i=0;i<S.exhibitVisitors.length;i++){
        const v=S.exhibitVisitors[i];
        const m=v.marker;
        const want=desired[i];
        if(!want){
            if(v.phase==='idle'){
                v.active=false;
                if(m)m.visible=false;
                continue;
            }
            if(v.phase!=='exit'){
                const area=exhibitVisitorArea(Math.max(0,v.nestIndex));
                v.tx=area.exitX;
                v.ty=area.exitY;
                v.phase='exit';
            }
        }else if(!v.active||v.nestIndex!==want.nestIndex||v.localIndex!==want.localIndex){
            const area=exhibitVisitorArea(want.nestIndex);
            v.active=true;
            v.nestIndex=want.nestIndex;
            v.localIndex=want.localIndex;
            v.phase='enter';
            v.x=area.entryX;
            v.y=area.entryY;
            v.alpha=0;
            v.pause=0;
            repickExhibitVisitorTarget(v);
        }
        if(v.pulse>0)v.pulse=Math.max(0,v.pulse-dt/60);
        if(v.phase==='idle'){
            if(m)m.visible=false;
            continue;
        }
        const moveStep=cs*.24*(v.speed||1)*stepBase;
        if(v.phase==='pause'){
            v.pause=Math.max(0,v.pause-stepBase);
            if(v.pause<=0){
                repickExhibitVisitorTarget(v);
                v.phase='walk';
            }
        }else{
            const dx=v.tx-v.x,dy=v.ty-v.y;
            const dist=Math.hypot(dx,dy);
            if(dist<=Math.max(1,moveStep)){
                v.x=v.tx;v.y=v.ty;
                if(v.phase==='exit'){
                    v.phase='idle';
                    v.active=false;
                    v.alpha=0;
                    if(m)m.visible=false;
                    continue;
                }
                v.phase='pause';
                v.pause=.6+Math.random()*1.35;
            }else if(dist>0){
                v.x+=(dx/dist)*moveStep;
                v.y+=(dy/dist)*moveStep;
            }
        }
        if(v.phase==='enter')v.alpha=Math.min(1,v.alpha+stepBase*2.4);
        else if(v.phase==='exit')v.alpha=Math.max(0,v.alpha-stepBase*2.1);
        else v.alpha=Math.min(1,v.alpha+stepBase*1.5);
        if(!m)continue;
        m.visible=true;
        if(m.parent!==humanTopL)humanTopL.addChild(m);
        const lookTilt=Math.max(-0.1,Math.min(0.1,(v.tx-v.x)/Math.max(cs,1)*0.08));
        const idleBob=Math.sin(S.idle*1.15+v.seed)*cs*.01;
        const pulse=(v.pulse>0)?Math.sin((1-v.pulse/.6)*Math.PI):0;
        m.x=v.x;
        m.y=v.y+idleBob-pulse*cs*.05;
        m.zIndex=m.y;
        m.rotation=lookTilt+Math.sin(S.idle*.9+v.seed)*0.015;
        const baseS=(isWideViewport()?.92:.82)*(1+((v.localIndex||0)%3)*.04);
        m.scale.set(baseS*(1+pulse*.18));
        m.alpha=v.alpha;
        if(m._body)m._body.alpha=.78+pulse*.22;
        if(m._head)m._head.alpha=.9;
    }
}

function hasLiveTierInScene(tier){
    const want=tier|0;
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r]?.[c];
        if(cl&&!cl.reserved&&!cl.merging&&cl.tier===want)return true;
    }
    for(let i=0;i<NEST_COUNT;i++){
        const n=S.nests[i];

function pickCaveVisitTier(slotIndex){
    const latest=highestDiscoveredTier();
    const candidates=[
        {tier:latest,weight:2},
        {tier:Math.max(1,latest-1),weight:1},
        {tier:Math.max(1,latest-2),weight:1},
    ];
    const unique=[];
    const seen=new Set();
    for(const c of candidates){
        if(seen.has(c.tier))continue;
        seen.add(c.tier);
        unique.push(c);
    }
    const blocked=new Set();
    const cvs=caveVisitStates();
    for(let i=0;i<cvs.length;i++){
        if(i===slotIndex)continue;
        const cv=cvs[i];
        if(!cv||cv.phase==='idle'||cv.offerTier<1)continue;
        blocked.add(cv.offerTier);
    }
    let pool=unique.filter(v=>!blocked.has(v.tier));
    if(!pool.length)pool=unique;
    let total=0;
    for(const v of pool)total+=v.weight;
    let roll=Math.random()*total;
    for(const v of pool){
        roll-=v.weight;
        if(roll<=0)return v.tier;
    }
    return pool[0]?.tier||latest;
}

function playCaveTradeRewardFx(gx,gy,amt,onCollect=null,opts=null){
    const rawStarts=Array.isArray(opts?.coinStarts)&&opts.coinStarts.length?opts.coinStarts:[new PIXI.Point(gx,gy)];
    const rawSweep=Array.isArray(opts?.coinSweepPoints)&&opts.coinSweepPoints.length?opts.coinSweepPoints:rawStarts;
    const orderedStarts=rawStarts.map(p=>new PIXI.Point(p.x,p.y));
    const coinCount=Math.max(1,opts?.coinCountOverride??orderedStarts.length??(isWideViewport()?6:5));
    const hudGp=coinHudGlobalPos();
    const hudLp=uiL.toLocal(hudGp,app.stage);
    let landed=0,settled=false;
    const settledCoins=[];
    let launchedSweep=false;
    const maybeFinish=()=>{
        if(settled||landed<coinCount)return;
        settled=true;
        if(onCollect)onCollect();
    };
    const maybeLaunchSweep=()=>{
        if(launchedSweep||settledCoins.length<coinCount)return;
        launchedSweep=true;
        settledCoins.sort((a,b)=>isWideViewport()?(a._sweepY-b._sweepY):(a._sweepX-b._sweepX));
        for(let i=0;i<settledCoins.length;i++){
            const coin=settledCoins[i];
            const sx=coin.x,sy=coin.y,tx=hudLp.x,ty=hudLp.y;
            const dx=tx-sx,dy=ty-sy;
            let t=0;
            const dur=18+(i%3)*2;
            const flyTick=(dt)=>{
                if(!coin.parent){app.ticker.remove(flyTick);return;}
                t+=dt;
                const p=Math.min(1,t/dur);
                const e=easeOQ(p);
                const arc=4*(18*UI)*p*(1-p);
                coin.x=sx+dx*e;
                coin.y=sy+dy*e-arc;
                coin.scale.set((coin._baseScaleX??1)*(1-(p*.35)),(coin._baseScaleY??1)*(1-(p*.35)));
                if(p<1)return;
                app.ticker.remove(flyTick);
                coin.parent?.removeChild(coin);
                coin.destroy();
                landed++;
                maybeFinish();
            };
            setTimeout(()=>app.ticker.add(flyTick),1000+(i*30));
        }
    };
    for(let i=0;i<coinCount;i++){
        const startGp=orderedStarts[i%orderedStarts.length]||orderedStarts[0]||new PIXI.Point(gx,gy);
        const sweepGp=rawSweep[i%rawSweep.length]||startGp;
        const startLp=uiL.toLocal(startGp,app.stage);
        const coin=makeButtonCoinIcon(12*UI);
        if(coin.anchor)coin.anchor.set(.5);
        coin.eventMode='none';
        coin.interactiveChildren=false;
        coin.x=startLp.x+(Math.random()*8-4)*UI;
        coin.y=startLp.y+(Math.random()*5-2.5)*UI;
        coin.rotation=(Math.random()*0.18-.09);
        uiL.addChild(coin);
        const baseScaleX=coin.scale?.x??1;
        const baseScaleY=coin.scale?.y??1;
        coin._baseScaleX=baseScaleX;
        coin._baseScaleY=baseScaleY;
        coin._sweepX=sweepGp.x;
        coin._sweepY=sweepGp.y;
        const dropDx=isWideViewport()?((Math.random()*14-7)*UI):((Math.random()*4-2)*UI);
        const dropDy=isWideViewport()?(-(Math.random()*4*UI)):(-(Math.random()*8*UI));
        const settleX=startLp.x+dropDx;
        const settleY=startLp.y+dropDy;
        tw(coin,{x:settleX,y:settleY,rotation:0},10,easeOB,()=>{
            settledCoins.push(coin);
            maybeLaunchSweep();
        });
    }
}

function playMeteorCoinRewardFx(gx,gy,amt,opts=null){
    if(!(amt>0))return;
    if(S.powerIntro?.contextual){creditMeteorCoinsWithoutFlight(amt);return;}
    const coinCount=Math.max(1,opts?.coinCountOverride??meteorRewardCoinCountForAmt(amt));
    const hudGp=coinHudGlobalPos();
    const startLp=uiL.toLocal(new PIXI.Point(gx,gy),app.stage);
    const hudLp=uiL.toLocal(hudGp,app.stage);
    const coinValues=new Array(coinCount).fill(Math.floor(amt/coinCount));
    let remainder=amt-coinValues.reduce((s,v)=>s+v,0);
    for(let i=0;i<coinCount&&remainder>0;i++,remainder--)coinValues[i]++;
    const coins=[];
    for(let i=0;i<coinCount;i++){
        const coin=makeButtonCoinIcon(10*UI);
        if(coin.anchor)coin.anchor.set(.5);
        coin.eventMode='none';
        coin.interactiveChildren=false;
        coin.x=startLp.x+(Math.random()*10-5)*UI;
        coin.y=startLp.y+(Math.random()*4-2)*UI;
        coin.rotation=(Math.random()*0.2-.1);
        const bsx=coin.scale?.x??1,bsy=coin.scale?.y??1;
        coin._baseScaleX=bsx;
        coin._baseScaleY=bsy;
        coin._phase='drop';
        coin._t=0;
        coin._rerouteAt=36+Math.random()*16;
        coin._vx=(Math.random()*1.8-0.9)*UI;
        coin._vy=-(1.15+Math.random()*0.55)*UI;
        coin._grav=(0.16+Math.random()*0.05)*UI;
        coin._value=coinValues[i]||0;
        uiL.addChild(coin);
        coins.push(coin);
    }
    const tick=(dt)=>{
        if(S.powerIntro?.contextual){
            let unsettledValue=0;
            for(const coin of coins){
                if(!coin.parent)continue;
                unsettledValue+=coin._value||0;
                coin._value=0;
                coin.parent.removeChild(coin);
                coin.destroy();
            }
            creditMeteorCoinsWithoutFlight(unsettledValue);
            app.ticker.remove(tick);
            return;
        }
        let alive=0;
        for(const coin of coins){
            if(!coin.parent)continue;
            alive++;
            if(coin._phase==='drop'){
                coin._t+=dt;
                coin.x+=coin._vx*dt;
                coin.y+=coin._vy*dt;
                coin._vy+=coin._grav*dt;
                coin.rotation+=coin._vx*.012;
                if(coin._t<coin._rerouteAt)continue;
                coin._phase='fly';
                coin._ft=0;
                coin._fd=16+Math.random()*4;
                coin._sx=coin.x;
                coin._sy=coin.y;
            }
            if(coin._phase==='fly'){
                coin._ft+=dt;
                const p=Math.min(1,coin._ft/coin._fd);
                const e=easeOQ(p);
                const arc=4*(14*UI)*p*(1-p);
                coin.x=coin._sx+(hudLp.x-coin._sx)*e;
                coin.y=coin._sy+(hudLp.y-coin._sy)*e-arc;
                coin.scale.set((coin._baseScaleX||1)*(1-p*.28),(coin._baseScaleY||1)*(1-p*.28));
                if(p<1)continue;
                if((coin._value||0)>0){
                    S.econ.comet=(S.econ.comet||0)+(coin._value||0);
                    S.coins+=coin._value||0;
                    updCoins();
                    updAllBtns();
                    coin._value=0;
                }
                coin.parent?.removeChild(coin);
                coin.destroy();
                alive--;
            }
        }
        if(alive>0)return;
        app.ticker.remove(tick);
    };
    app.ticker.add(tick);
}

function nestHumanRewardCoinSources(nestIndex,gx,gy){
    if(Number.isInteger(nestIndex)&&Array.isArray(S.exhibitVisitors)){
        const starts=[],sweepPoints=[];
        for(const v of S.exhibitVisitors){
            if(!v?.active||v.nestIndex!==nestIndex||!v.marker?.visible)continue;
            starts.push(v.marker.getGlobalPosition(new PIXI.Point()));
            const tx=Number.isFinite(v.tx)?v.tx:v.marker.x;
            const ty=Number.isFinite(v.ty)?v.ty:v.marker.y;
            sweepPoints.push(humanTopL.toGlobal(new PIXI.Point(tx,ty)));
        }
        if(starts.length)return {starts,sweepPoints};
    }
    const p=new PIXI.Point(gx,gy);
    return {starts:[p],sweepPoints:[p]};
}
function nestHumanRewardCoinCount(nestIndex){
    if(!Number.isInteger(nestIndex)||!Array.isArray(S.exhibitVisitors))return 1;
    let count=0;
    for(const v of S.exhibitVisitors){
        if(v?.active&&v.nestIndex===nestIndex&&v.marker?.visible)count++;
    }
    return Math.max(1,count);
}
function playNestRewardFx(gx,gy,amt,opts){
    if(amt<=0)return;
    const src=nestHumanRewardCoinSources(opts?.nestIndex,gx,gy);
    playCaveTradeRewardFx(gx,gy,amt,null,{
        coinCountOverride:nestHumanRewardCoinCount(opts?.nestIndex),
        coinStarts:src.starts,
        coinSweepPoints:src.sweepPoints
    });
}
function playNestRewardSweepFx(entries){
    if(!Array.isArray(entries)||!entries.length)return;
    const starts=[],sweepPoints=[];
    let totalAmt=0;
    for(const e of entries){
        if(!e||!(e.amt>0))continue;
        totalAmt+=e.amt;
        const src=nestHumanRewardCoinSources(e.nestIndex,e.gx,e.gy);
        starts.push(...(src.starts||[]));
        sweepPoints.push(...(src.sweepPoints||src.starts||[]));
    }
    if(totalAmt<=0)return;
    playCaveTradeRewardFx(entries[0].gx,entries[0].gy,totalAmt,null,{
        coinCountOverride:Math.max(1,starts.length),
        coinStarts:starts,
        coinSweepPoints:sweepPoints
    });
}
