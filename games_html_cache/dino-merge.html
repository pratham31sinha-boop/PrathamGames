function updCaveVisit(dt){
    if(!ZOO_GAMEPLAY){return;}
    updateExhibitVisitors(dt);
    return;
    ensureCaveHumans();
    const wide=isWideViewport();
    const cvs=caveVisitStates();
    if(!S.caveHumans?.slots?.length||!cvs.length)return;
    const activeSlotCount=CAVE_HUMANS_VISUAL_ONLY?CAVE_VISIT_SLOTS:(S.tut.caveDone?CAVE_VISIT_SLOTS:1);
    if(activeSlotCount<cvs.length){
        for(let i=activeSlotCount;i<cvs.length;i++){
            const cv=cvs[i];
            cv.phase='idle';cv.slide=0;cv.dialogScale=0;cv.hover=false;cv.companionTier=0;cv.leaveAt=0;cv.nextAt=0;cv.fxTick=0;
            resetCaveVisitVisuals(i);
        }
    }
    if(!caveVisitUnlocked()){
        for(let i=0;i<cvs.length;i++){
            const cv=cvs[i];
            cv.phase='idle';cv.slide=0;cv.dialogScale=0;cv.hover=false;cv.companionTier=0;cv.leaveAt=0;cv.nextAt=0;cv.fxTick=0;
        }
        resetCaveVisitVisuals();
        return;
    }
    if(CAVE_HUMANS_VISUAL_ONLY){
        const assignments=buildVisualCaveAssignments();
        for(let i=0;i<cvs.length;i++){
            const cv=cvs[i];
            const slot=caveSlotVisual(i);
            const asn=assignments[i]||null;
            if(!slot)continue;
            const visualKind=(i%2===0)?'boy':'girl';
            cv.kind=visualKind;
            if(cv&&cv.reactT>0)cv.reactT=Math.max(0,cv.reactT-dt/60);
            cv.bob+=(dt*.045);
            cv.hover=false;
            cv.offerTier=0;
            cv.companionTier=0;
            cv.fxTick=0;
            if(!asn){
                if(cv.nestIndex>=0&&S.nests[cv.nestIndex]?.merging){
                    cv.phase='waiting';
                    cv.slide=1;
                    if(slot.mode!=='normal')setCaveHumanKind(i,cv.kind||slot.kind||'boy');
                    continue;
                }
                if(cv.phase==='idle'){
                    cv.nestIndex=-1;
                    cv.localIndex=0;
                    cv.groupSize=0;
                    cv.pairIndex=-1;
                    cv.offRight=false;
                    cv.swarmOx=0;cv.swarmOy=0;cv.swarmTx=0;cv.swarmTy=0;cv.swarmPause=0;
                    resetCaveVisitVisuals(i);
                    continue;
                }
                cv.phase='leaving';
                cv.slide=Math.max(0,(cv.slide||1)-dt/32);
                if(cv.slide<=0){
                    cv.phase='idle';cv.slide=0;cv.dialogScale=0;cv.leaveAt=0;cv.nextAt=0;
                    cv.nestIndex=-1;
                    cv.localIndex=0;
                    cv.groupSize=0;
                    cv.pairIndex=-1;
                    cv.offRight=false;
                    cv.swarmOx=0;cv.swarmOy=0;cv.swarmTx=0;cv.swarmTy=0;cv.swarmPause=0;
                    resetCaveVisitVisuals(i);
                }
                if(slot.mode!=='normal')setCaveHumanKind(i,cv.kind||slot.kind||'boy');
                continue;
            }
            if(cv.phase==='leaving'&&(cv.nestIndex!==asn.nestIndex||cv.localIndex!==asn.localIndex)){
                cv.slide=Math.max(0,(cv.slide||1)-dt/32);
                if(cv.slide<=0){
                    cv.phase='idle';cv.slide=0;cv.dialogScale=0;cv.leaveAt=0;cv.nextAt=0;
                    cv.nestIndex=-1;
                    cv.localIndex=0;
                    cv.groupSize=0;
                    cv.pairIndex=-1;
                    cv.offRight=false;
                    cv.swarmOx=0;cv.swarmOy=0;cv.swarmTx=0;cv.swarmTy=0;cv.swarmPause=0;
                    resetCaveVisitVisuals(i);
                }
                if(slot.mode!=='normal')setCaveHumanKind(i,cv.kind||slot.kind||'boy');
                continue;
            }
            const changed=cv.nestIndex!==asn.nestIndex||cv.localIndex!==asn.localIndex;
            cv.nestIndex=asn.nestIndex;
            cv.localIndex=asn.localIndex;
            cv.groupSize=asn.groupSize;
            cv.pairIndex=asn.pairIndex;
            cv.offerTier=asn.tier;
            if(cv.phase==='idle'||changed){
                cv.offRight=!wide&&asn.pairIndex===1;
                cv.phase='enter';
                cv.slide=changed?Math.min(cv.slide||0,.2):0;
                cv.dialogScale=0;
                cv.swarmOx=0;cv.swarmOy=0;
                repickSwarmOffset(cv,i);
                setCaveHumanKind(i,visualKind);
            }else if(cv.phase==='enter'){
                cv.slide=Math.min(1,cv.slide+dt/26);
                if(cv.slide>=1){
                    cv.phase='waiting';
                    cv.swarmPause=.25+Math.random()*.65;
                }
            }else{
                cv.slide=1;
                const moveStep=(dt/60)*cs*.22*(cv.swarmSpeed||1);
                if((cv.swarmPause||0)>0){
                    cv.swarmPause=Math.max(0,cv.swarmPause-dt/60);
                    if(cv.swarmPause<=0)repickSwarmOffset(cv,i);
                }else{
                    const dx=(cv.swarmTx||0)-(cv.swarmOx||0);
                    const dy=(cv.swarmTy||0)-(cv.swarmOy||0);
                    const dist=Math.hypot(dx,dy);
                    if(dist<=moveStep||dist<cs*.02){
                        cv.swarmOx=cv.swarmTx||0;
                        cv.swarmOy=cv.swarmTy||0;
                        cv.swarmPause=.55+Math.random()*1.35;
                    }else{
                        cv.swarmOx+=(dx/dist)*moveStep;
                        cv.swarmOy+=(dy/dist)*moveStep;
                    }
                }
            }
            const desiredMode=currentCaveHumanMode(cv);
            if(slot.mode!==desiredMode||slot.kind!==visualKind)setCaveHumanKind(i,visualKind);
        }
        updateCaveHumans();
        return;
    }
    for(let i=0;i<cvs.length;i++){
        const cv=cvs[i];
        const slot=caveSlotVisual(i);
        if(!slot)continue;
        if(cv&&cv.reactT>0)cv.reactT=Math.max(0,cv.reactT-dt/60);
        if(i>=activeSlotCount){
            resetCaveVisitVisuals(i);
            continue;
        }
        cv.bob+=(dt*.045);
        if(cv.phase==='idle'){
            resetCaveVisitVisuals(i);
            if(!cv.nextAt)cv.nextAt=Date.now()+CAVE_VISIT_ENTRY_DELAY_MS+(i*2000);
            if(Date.now()>=cv.nextAt&&!S.popup&&!S.drag)startCaveVisit(i);
            continue;
        }
        if(!S.drag)cv.hover=false;
        if(slot.mode!==currentCaveHumanMode(cv))setCaveHumanKind(i,cv.kind||slot.kind||'boy');
        if(cv.hover&&cv.phase==='waiting'&&S.drag&&slot.dialog&&slot.main){
            cv.fxTick=(cv.fxTick||0)+dt;
            const humanX=slot.main.x,humanY=slot.main.y-cs*.72;
            const dlgDino=slot.dialog._dino;
            const targetX=slot.dialog.x+(dlgDino?.x||0),targetY=slot.dialog.y-(cs*.55);
            if(cv.fxTick>=16){
                cv.fxTick=0;
                spawnCaveHeart((humanX+targetX)*.5,(humanY+targetY)*.5-cs*.08,1);
            }
        }else if((cv.phase==='claimed'||cv.phase==='leaving')&&slot.main&&slot.companion?.visible){
            cv.fxTick=(cv.fxTick||0)+dt;
            const humanX=slot.main.x,humanY=slot.main.y-cs*.72;
            const compX=slot.companion.x,compY=slot.companion.y-cs*.38;
            if(cv.fxTick>=18){
                cv.fxTick=0;
                spawnCaveHeart((humanX+compX)*.5,(humanY+compY)*.5-cs*.08,.72);
            }
        }else{
            cv.fxTick=0;
        }
        if(cv.phase==='enter'){
            cv.slide=Math.min(1,cv.slide+dt/26);
            if(cv.slide>=1){
                cv.phase='waiting';
                if(slot.dialog){
                    slot.dialog.visible=true;
                    slot.dialog.scale.set(.15);
                    tw(slot.dialog.scale,{x:1,y:1},11,easeOB);
                }
                cv.dialogScale=1;
            }
        }else if(cv.phase==='waiting'){
            cv.slide=1;
        }else if(cv.phase==='claimed'){
            cv.slide=1;
            if(Date.now()>=cv.leaveAt)cv.phase='leaving';
        }else if(cv.phase==='leaving'){
            cv.slide=Math.max(0,cv.slide-dt/32);
            if(cv.slide<=0){
                cv.phase='idle';
                cv.nextAt=Date.now()+CAVE_VISIT_EXIT_GAP_MS;
                cv.leaveAt=0;
                cv.offerTier=0;
                cv.companionTier=0;
                cv.hover=false;
                resetCaveVisitVisuals(i);
            }
        }
    }
    updateCaveHumans();
}

function updateCaveHumans(){
    if(!ZOO_GAMEPLAY){return;}
    updateExhibitVisitors(0);
    return;
    if(!SHOW_CAVE_HUMANS){
        if(S.caveHumans?.slots){
            for(const slot of S.caveHumans.slots){
                if(slot.mainShadow)slot.mainShadow.visible=false;
                if(slot.companionShadow)slot.companionShadow.visible=false;
                slot.main.visible=false;
                if(slot.dialog)slot.dialog.visible=false;
                if(slot.companion)slot.companion.visible=false;
            }
        }
        return;
    }
    if(!S.caveHumans?.slots)return;
    const wide=isWideViewport();
    const slotGap=wide?cs*3:cs*3;
    const leftPos=nPos(0);
    const b=playGridBounds();
    const targetH=cs*(wide?1.5:1.5);
    const scale=(targetH/256)*(wide?1:.7);
    const dialogSize=cs*(wide?2.25:1.95);
    const dialogDinoH=dialogSize*(wide?.62:.58);
    const visualOnly=CAVE_HUMANS_VISUAL_ONLY;
    const cvs=caveVisitStates();
    for(let i=0;i<S.caveHumans.slots.length;i++){
        const slot=S.caveHumans.slots[i];
        const cv=cvs[i];
        const human=slot.main,dialog=slot.dialog,companion=slot.companion;
        if(human?._isSwarmMarker){
            const humanVisible=!!cv&&cv.phase!=='idle';
            const targetPos=visualOnly?caveVisualHumanTarget(cv,i):null;
            const targetX=targetPos?targetPos.x:((wide?(leftPos.x-cs*1.5):(b.x-cs*0.4)));
            const targetY=targetPos?targetPos.y:((wide?(leftPos.y+cs*2):(leftPos.y+cs*3))+(i*slotGap));
            const offX=(visualOnly&&!wide&&cv?.offRight)?(targetX+cs*2.35):(targetX-(wide?cs*2.8:cs*2.35));
            const slide=cv?.slide??0;
            const seed=human._swarmSeed||0;
            const reactPull=(cv?.reactT>0)?1:0;
            const reactProg=reactPull?Math.max(0,Math.min(1,1-((cv?.reactT||0)/Math.max(.0001,cv?.reactDur||.64)))):0;
            const reactPulse=reactPull?Math.sin(reactProg*Math.PI):0;
            const idleShimX=Math.sin(S.idle*1.3+seed)*cs*.012;
            const idleShimY=Math.cos(S.idle*1.05+seed*.81)*cs*.01;
            const walkX=(cv?.swarmOx||0)+idleShimX;
            const walkY=(cv?.swarmOy||0)+idleShimY;
            if(human.parent!==humanTopL)humanTopL.addChild(human);
            human.x=offX+(targetX-offX)*slide+walkX;
            human.y=targetY+walkY-reactPulse*cs*.06;
            human.zIndex=human.y;
            const lookTilt=Math.max(-0.09,Math.min(0.09,-walkX/Math.max(cs*.9,1)*0.08));
            human.rotation=lookTilt+Math.sin(S.idle*1.1+seed)*0.02;
            const baseS=(wide?.92:.82)*(1+((cv?.localIndex||0)%3)*.04);
            const pulseS=1+reactPulse*.22;
            human.scale.set(baseS*pulseS);
            if(human._body)human._body.alpha=.78+reactPulse*.22;
            if(human._head)human._head.alpha=.88;
            human.visible=humanVisible;
            if(slot.mainShadow)slot.mainShadow.visible=false;
            if(slot.companionShadow)slot.companionShadow.visible=false;
            if(dialog){dialog.visible=false;dialog.scale.set(0);}
            if(companion)companion.visible=false;
            continue;
        }
        const humanVisible=!!cv&&cv.phase!=='idle';
        const reactPull=(cv?.reactT>0)?1:0;
        const hoverPull=(cv?.hover&&cv?.phase==='waiting'&&S.drag)?1:0;
        const hoverHopWave=hoverPull?Math.max(0,Math.sin(S.idle*7.6)):0;
        const reactProg=reactPull?Math.max(0,Math.min(1,1-((cv?.reactT||0)/Math.max(.0001,cv?.reactDur||.64)))):0;
        const reactHopWave=reactPull?Math.sin(reactProg*Math.PI):0;
        const hopWave=Math.max(hoverHopWave,reactHopWave);
        const hopCycle=hopWave*hopWave;
        const hopMul=(reactPull?2*(cv?.reactHopMul||1):1);
        const hopLift=hopCycle*cs*.085*hopMul;
        const hopTilt=hoverPull?(Math.sin(S.idle*7.6)*0.028):(reactPull?Math.sin(reactProg*Math.PI)*0.028:0);
        human.scale.set(scale);
        if(dialog){
            if(visualOnly){
                dialog.visible=false;
                dialog.scale.set(0);
            }else{
                dialog.visible=!!bgShopDialogTex;
                const bubble=dialog._bubble,dino=dialog._dino,tier=dialog._tier||1;
                if(bubble){
                    bubble.texture=bgShopDialogTex||PIXI.Texture.WHITE;
                    bubble.width=dialogSize;
                    bubble.height=dialogSize;
                }
                if(dino){
                    dino.texture=creatureTexture(tier,false,-1);
                    const t=dino.texture;
                    const sc=dialogDinoH/Math.max(1,t.height||1);
                    const pulse=hoverPull?(1.03+Math.sin(S.idle*5.5)*.025):1;
                    dino.scale.set(sc*0.9*pulse);
                    dino.x=0;
                    dino.y=-dialogSize*.35;
                    dino.rotation=0;
                }
                if(dialog._rewardRow&&dialog._rewardTxt){
                    dialog._rewardTxt.text=Math.round(baseRewardForTier(tier)*3).toString();
                    centerPriceRow(dialog._rewardCoin,dialog._rewardTxt,6*UI);
                    dialog._rewardRow.x=0;
                    dialog._rewardRow.y=-dialogSize*.375;
                }
                if(dialog._glow){
                    dialog._glow.clear();
                    dialog._glow.visible=false;
                }
            }
        }
        const targetPos=visualOnly?caveVisualHumanTarget(cv,i):null;
        const targetX=targetPos?targetPos.x:((wide?(leftPos.x-cs*1.5):(b.x-cs*0.4)));
        const targetY=targetPos?targetPos.y:((wide?(leftPos.y+cs*2):(leftPos.y+cs*3))+(i*slotGap));
        const offX=(visualOnly&&!wide&&cv?.offRight)?(targetX+cs*2.35):(targetX-(wide?cs*2.8:cs*2.35));
        const slide=cv?.slide??0;
        const humanLayer=wide?humanTopL:humanTopL;
        if(human.parent!==humanLayer)humanLayer.addChild(human);
        human.x=offX+(targetX-offX)*slide;
        human.y=targetY-hopLift;
        human.zIndex=human.y;
        human.rotation=hoverPull?hopTilt:0;
        if(dialog){
            dialog.x=human.x;
            dialog.y=human.y-targetH*.75;
            dialog.visible=visualOnly?false:((cv?.phase==='waiting')&&!!bgShopDialogTex);
            dialog.scale.set((!visualOnly&&cv?.phase==='waiting')?(dialog.scale.x||1):0);
        }
        if(companion){
            const show=!visualOnly&&(cv?.phase==='claimed'||cv?.phase==='leaving')&&cv.companionTier>=1;
            companion.visible=show;
            if(show){
                companion.texture=creatureTexture(cv.companionTier,cv.companionMutant,cv.companionMutVar);
                const cSc=gridScale(cv.companionTier)*(wide?.82:1);
                companion.scale.set(-cSc,cSc);
                companion.x=human.x+(wide?cs*.72:cs*.58);
                companion.y=human.y-(wide?cs*.1:cs*.08);
            }
        }
        if(slot.mainShadow){
            const sh=slot.mainShadow;
            sh.visible=humanVisible;
            sh.x=human.x;
            sh.y=human.y-(wide?cs*.35:cs*.22)+hopLift;
            sh.scale.set((wide?1.55:1.55)*scale,(wide?1.55:1.55)*scale);
        }
        if(slot.companionShadow){
            const sh=slot.companionShadow;
            sh.visible=!!companion.visible;
            if(companion.visible){
                sh.x=companion.x;
                sh.y=companion.y-cs*.35;
                const absSc=Math.abs(companion.scale.x||1);
                sh.scale.set(absSc*(wide?3.5:1.2),absSc*(wide?3.5:1.2));
            }
        }
        human.visible=humanVisible;
    }
}

function splitTextureVertical(tex,top){
    if(!tex)return null;
    const frame=tex.frame||tex._frame;
    const base=tex.baseTexture||tex.source||tex;
    const w=Math.max(1,Math.round(tex.width||frame?.width||256));
    const h=Math.max(1,Math.round(tex.height||frame?.height||256));
    const split=Math.max(1,Math.min(h-1,64));
    const fx=frame?.x||0,fy=frame?.y||0;
    const rect=top?new PIXI.Rectangle(fx,fy,w,split):new PIXI.Rectangle(fx,fy+split,w,h-split);
    try{return new PIXI.Texture(base,rect);}catch(e){return tex;}
}

            console.warn('Startup atlas incomplete, retrying:',missing.join(', '));
            await new Promise(resolve=>setTimeout(resolve,400*(retry+1)));

    step(4);

function setCellAlpha(type,ci,row,occ){
    if(type==='grid'){
        const bg=S.cellBgs[row*COLS+ci];if(!bg)return;
        if(HIDDEN_GRID_PRESENTATION){
            bg._occ=!!occ;
            bg.alpha=0;
            bg.width=bg._baseW||cs;
            bg.height=bg._baseH||cs;
            bg.rotation=0;
            return;
        }
        const wasOcc=!!bg._occ;
        const bw=bg._baseW||cs,bh=bg._baseH||cs;
        bg._occ=!!occ;
        bg.alpha=occ?0:.4;
        if(occ){
            bg.width=bw;bg.height=bh;bg.rotation=0;
            return;
        }
        if(wasOcc){
            bg.width=Math.max(1,bw*.08);bg.height=Math.max(1,bh*.08);
            bg.rotation=(Math.random()<.5?-1:1)*(.07+Math.random()*.05);
            tw(bg,{width:bw*1.08,height:bh*1.08},5,easeOB,()=>tw(bg,{width:bw,height:bh},7,easeOQ));
            tw(bg,{rotation:0},12,easeOQ);
        } else {
            // Hard-reset idle empty cells so no stale tweened transform can linger.
            bg.width=bw;bg.height=bh;bg.rotation=0;
        }
    }
    else{
        const bg=S.nestBgs[ci];
        if(!bg)return;
        bg.alpha=HIDDEN_GRID_PRESENTATION?0:(occ?0:.25);
    }

        p.life-=dt/60;

function updNestBar(ni){

function updNests(dt){
    if(!NESTS_ENABLED||!ageHasNests())return;
    const speedMult=(S.speedBoost.active?2:1)*nestSpeedMult();
    const sec=dt/60*speedMult;
    if(!ZOO_GAMEPLAY){
        const mp=ensureMeteorPlayState();
        const hasLiveComet=meteorHasLiveComet();
        const weaponSec=dt/60*(S.speedBoost.active?4:1);
        if(hasLiveComet)mp.shotBeatTimer=(mp.shotBeatTimer||0)+weaponSec;
        else mp.shotBeatTimer=0;
        S.nestShared.timer=0;
        for(let i=0;i<NEST_COUNT;i++){
            const n=S.nests[i];
            if(!n)continue;
            if(n.tier<1||n.merging){
                n.timer=0;
                n.prodTime=n.tier>=1?nestRewardDurationForTier(n.tier):0;
                n.shotAccum=0;
                updNestBar(i);
                continue;
            }
            n.prodTime=nestRewardDurationForTier(n.tier);
            n.timer=(n.timer||0)+sec;
            const nestBeingDragged=!!(S.drag&&S.drag.tierData?.location==='nest'&&S.drag.tierData?.nestIndex===i);
            n.blockedNoSpace=false;
            if(nestBeingDragged||n.pendingImmediateShot||!hasLiveComet)n.shotAccum=0;
            while(n.prodTime>0&&n.timer>=n.prodTime){
                n.timer-=n.prodTime;
            }
            updNestBar(i);
        }
        if(!hasLiveComet){
            updSharedNestBar();
            return;
        }
        const beatSec=Math.max(.0001,meteorShotBeatSec());
        while(mp.shotBeatTimer>=beatSec){
            mp.shotBeatTimer-=beatSec;
            for(let i=0;i<NEST_COUNT;i++){
                const n=S.nests[i];
                if(!n||n.tier<1||n.merging||n.pendingImmediateShot)continue;
                if(S.drag&&S.drag.tierData?.location==='nest'&&S.drag.tierData?.nestIndex===i)continue;
                const shotRate=meteorShotRateForTier(n.tier);
                if(shotRate<=0)continue;
                n.shotAccum=(n.shotAccum||0)+(shotRate*beatSec);
                if(n.shotAccum<1)continue;
                n.shotAccum-=1;
                spawnMeteorProjectile(i,n.tier);
                n.shotPulseT=1;
                n.shotPulseSeed=Math.random()*Math.PI*2;
            }
        }
        updSharedNestBar();
        return;
    }
    const sharedDur=NEST_SHARED_REWARD_SEC;
    const activeCount=activeNestRewardCount();
    if(activeCount>0)S.nestShared.timer=(S.nestShared.timer||0)+sec;
    else S.nestShared.timer=0;
    while(activeCount>0&&S.nestShared.timer>=sharedDur){
        S.nestShared.timer-=sharedDur;
        const rewardFxEntries=[];
        for(let i=0;i<NEST_COUNT;i++){
            const n=S.nests[i];
            if(!n||n.tier<1||n.merging)continue;
            const amt=nestRewardAmountForTier(n.tier);
            if(amt>0){
                const gp=playArea.toGlobal(new PIXI.Point(nPos(i).x,nPos(i).y));
                S.coins+=amt;
                rewardFxEntries.push({nestIndex:i,gx:gp.x,gy:gp.y,amt});
            }
            n.eggs++;
            n.blockedNoSpace=false;
            if(n.warnTxt)n.warnTxt.visible=false;
            const fx=productionFxStrength(n.tier);
            n.pop=1+fx*.45;n.tilt=(Math.random()<.5?-1:1)*(.12+fx*.06);
            const ns=nestScale(n.tier);
            if(n.sprite&&n.sprite.parent){tw(n.sprite.scale,{x:ns*1.1,y:ns*.88},4,easeL,()=>{if(n.sprite&&n.sprite.parent)tw(n.sprite.scale,{x:ns,y:ns},8,easeOB);});}
            if(n.sprite&&n.sprite.parent)playMergeMouthForSprite(n.sprite);
            spawnP(partL,nPos(i).x,nPos(i).y+cs*.18,0xFFF8E1,4,{speed:3,life:.28,size:1.6});
            for(const v of (S.exhibitVisitors||[])){
                if(v?.active&&v.nestIndex===i){
                    v.pulse=Math.max(v.pulse||0,.6);
                }
            }
        }
        if(rewardFxEntries.length){
            updCoins();
            updAllBtns();
            playNestRewardSweepFx(rewardFxEntries);
        }
    }
    for(let i=0;i<NEST_COUNT;i++){
        const n=S.nests[i];
        if(!n)continue;
        if(n.tier<1||n.merging){
            n.timer=0;
            n.prodTime=n.tier>=1?nestRewardDurationForTier(n.tier):0;
            updNestBar(i);
            continue;
        }
        n.prodTime=sharedDur;
        n.timer=S.nestShared.timer;
        updNestBar(i);
    }
    updSharedNestBar();
}

function updateMeteorPlay(dt=0){
    if(!METEOR_PLAY){
        clearMeteorPlayState();
        return;
    }
    if(ensureMeteorPlayState().gameOver)return;
    if(!meteorTutorialReady()){
        clearMeteorPlayState();
        return;
    }
    if(!bgCometTex||!meteorProjectileTex)return;
    const mp=ensureMeteorPlayState();
    if(mp.pending.length===0&&mp.comets.length===0){
        mp.waveTimer=Math.max(0,(mp.waveTimer||0)-dt);
        if(mp.waveTimer<=0)queueMeteorWave();
    }else if(mp.pending.length>0){
        for(let i=mp.pending.length-1;i>=0;i--){
            const e=mp.pending[i];
            e.delay-=dt;
            if(e.delay>0)continue;
            if(!spawnMeteorComet(e.col,e.tier,e.waveIndex,null,!!e.boss))continue;
            if(e.boss)mp.bossQueued=false;
            mp.pending.splice(i,1);
        }
    }
    for(let i=mp.projectiles.length-1;i>=0;i--){
        const p=mp.projectiles[i];
        const spr=p?.sprite;
        if(!spr||!spr.parent){mp.projectiles.splice(i,1);continue;}
        const step=Math.hypot(p.vx||0,p.vy||0)*dt;
        p.x+=(p.vx||0)*dt;
        p.y+=(p.vy||0)*dt;
        p.travel+=step;
        spr.x=p.x;
        spr.y=p.y;
        spr.alpha=1;
        spr.zIndex=spr.y;
        const bs=(spr._baseScale??p._baseScale??.18);
        const q=Math.min(1,p.maxTravel>0?(p.travel/p.maxTravel):1);
        const pulse=Math.sin(q*Math.PI*6.5+i*.7);
        spr.scale.set(bs*(1.1+pulse*.14),bs*(0.9-pulse*.1));
        if(p.travel<p.maxTravel)continue;
        spr.parent?.removeChild(spr);
        spr.destroy?.({children:true});
        mp.projectiles.splice(i,1);
    }
    for(let i=mp.comets.length-1;i>=0;i--){
        const c=mp.comets[i];
        const spr=c?.sprite;
        const hpBar=c?.hpBar;
        const impactTxt=c?.impactTxt;
        if(!spr||!spr.parent){
            c?._crackOverlay?.parent?.removeChild(c._crackOverlay);
            c?._crackOverlay?.destroy?.({children:true});
            hpBar?.parent?.removeChild(hpBar);
            hpBar?.destroy?.({children:true});
            impactTxt?.parent?.removeChild(impactTxt);
            impactTxt?.destroy?.({children:true});
            mp.comets.splice(i,1);
            continue;
        }
        const cometSpeedMul=DEV_MODE&&S.devTools&&Number.isFinite(S.devTools.meteorCometSpeedMul)?Math.max(.25,S.devTools.meteorCometSpeedMul):1;
        const path=meteorCometPathBounds();
        const pathLen=Math.max(1,path.endY-path.startY);
        const bossSpeedMul=c.boss?.8:1;
        c.pathT=(c.pathT||0)+((cs*METEOR_COMET_SPEED_MULT*cometSpeedMul*bossSpeedMul*dt)/pathLen);
        c.hitCeilingY=path.startY;
        c.y=path.startY+((path.endY-path.startY)*(c.pathT||0));
        if((c.hitReactT||0)>0)c.hitReactT=Math.max(0,(c.hitReactT||0)-dt*.16);
        const baseRot=METEOR_COMET_ROT;
        const baseX=c.x;
        const baseY=c.y+(c.visualYOffset||0);
        spr.x=baseX;
        spr.y=baseY;
        if((c.hitReactT||0)>0){
            const q=1-Math.max(0,Math.min(1,c.hitReactT||0));
            const shake=Math.sin(q*Math.PI*5.5+(c.hitReactSeed||0))*cs*.035*(c.hitReactT||0);
            spr.x+=shake;
            spr.rotation=baseRot+Math.sin(q*Math.PI*7+(c.hitReactSeed||0))*.05*(c.hitReactT||0);
        }else{
            spr.rotation=baseRot;
        }
        spr.zIndex=spr.y;
        syncMeteorCrackOverlay(c);
        if(hpBar&&hpBar.parent){
            hpBar.x=c.x;
            hpBar.y=c.y+meteorHpDisplayYOffset();
            hpBar.zIndex=spr.y+1;
            drawMeteorHpBar(hpBar,c.hp||0,c.maxHp||1);
        }
        if(impactTxt&&impactTxt.parent){
            const showImpact=meteorCometDangerActive(c);
            impactTxt.visible=showImpact;
            if(showImpact){
                impactTxt.x=c.x;
                impactTxt.y=c.y-cs*.42;
                impactTxt.zIndex=spr.y+2;
                impactTxt.alpha=.92+.08*Math.sin(S.idle*7+(c.col||0)*.8);
                impactTxt.scale.set(1+.03*Math.sin(S.idle*9+(c.col||0)*.6));
            }else{
                impactTxt.scale.set(1);
                impactTxt.alpha=.96;
            }
        }
        const failRect=meteorRebuildColliderRect();
        const hc=meteorCometHitPos(c);
        if(hc.x+hc.r>=failRect.x&&hc.x-hc.r<=failRect.x+failRect.w&&hc.y+hc.r>=failRect.y&&hc.y-hc.r<=failRect.y+failRect.h){
            triggerMeteorRebuildFailure(hc.x,hc.y,c);
            return;
        }
        if((c.pathT||0)<=1)continue;
        c?._crackOverlay?.parent?.removeChild(c._crackOverlay);
        c?._crackOverlay?.destroy?.({children:true});
        c._crackOverlay=null;
        spr.parent?.removeChild(spr);
        spr.destroy?.({children:true});
        hpBar?.parent?.removeChild(hpBar);
        hpBar?.destroy?.({children:true});
        impactTxt?.parent?.removeChild(impactTxt);
        impactTxt?.destroy?.({children:true});
        mp.comets.splice(i,1);
    }
    for(let pi=mp.projectiles.length-1;pi>=0;pi--){
        const p=mp.projectiles[pi];
        let hit=false;
        for(let ci=mp.comets.length-1;ci>=0;ci--){
            const c=mp.comets[ci];
            if(c.y<(c.hitCeilingY??meteorProjectileCeilingY()))continue;
            const hp=meteorProjectileHitPos(p);
            const hc=meteorCometHitPos(c);
            const dx=hp.x-hc.x,dy=hp.y-hc.y;
            const rr=hp.r+hc.r;
            if(dx*dx+dy*dy>rr*rr)continue;
            hit=true;
            const dmg=Math.max(1,Math.round(p.dmg||100));
            const hpBefore=Math.max(1,c.hp||1);
            c.hp=Math.max(0,(c.hp||1)-dmg);
            const remainingHitCount=Math.max(1,Math.ceil(hpBefore/dmg));
            const hitAmt=Math.max(0,Math.round((c.hitRewardPoolRemaining||0)/remainingHitCount));
            if(hitAmt>0){
                c.hitRewardPoolRemaining=Math.max(0,(c.hitRewardPoolRemaining||0)-hitAmt);
                if(SOFT_RELEASE_GAMEPLAY){
                    const gp=playArea.toGlobal(new PIXI.Point(hc.x,hc.y));
                    playMeteorCoinRewardFx(gp.x,gp.y,hitAmt,{coinCountOverride:Math.min(2,meteorRewardCoinCountForAmt(hitAmt))});
                }
            }
            queueMeteorHitSfx(!!c.boss);
            kickMeteorCometHitFx(c);
            syncMeteorCrackOverlay(c);
            drawMeteorHpBar(c.hpBar,c.hp||0,c.maxHp||1);
            if(c.hp<=0){
                finishMeteorAttempt(c,'complete');
                if(!SOFT_RELEASE_GAMEPLAY&&!c.boss&&meteorDeadlockRecoveryActive()){
                    const recoverAmt=Math.max(0,Math.round(eggCost()*4));
                    if(recoverAmt>0){
                        const gp=playArea.toGlobal(new PIXI.Point(hc.x,hc.y));
                        playMeteorCoinRewardFx(gp.x,gp.y,recoverAmt,{coinCountOverride:meteorRewardCoinCountForAmt(recoverAmt)});
                    }
                }
                const destroyAmt=Math.max(0,c.destroyReward||0);
                if(destroyAmt>0){
                    const gp=playArea.toGlobal(new PIXI.Point(hc.x,hc.y));
                    playMeteorCoinRewardFx(gp.x,gp.y,destroyAmt,{coinCountOverride:meteorRewardCoinCountForAmt(destroyAmt)});
                }
                S.stats.meteorsDestroyed=(S.stats.meteorsDestroyed||0)+1;
                queueMeteorDestroyCommercialBreak();
                const wasBoss=!!c.boss;
                playMeteorCometDestroyFx(c);
                c?._crackOverlay?.parent?.removeChild(c._crackOverlay);
                c?._crackOverlay?.destroy?.({children:true});
                c._crackOverlay=null;
                c.sprite?.parent?.removeChild(c.sprite);
                c.sprite?.destroy?.({children:true});
                c.hpBar?.parent?.removeChild(c.hpBar);
                c.hpBar?.destroy?.({children:true});
                c.impactTxt?.parent?.removeChild(c.impactTxt);
                c.impactTxt?.destroy?.({children:true});
                mp.comets.splice(ci,1);
                if(wasBoss){
                    p.sprite?.parent?.removeChild(p.sprite);
                    p.sprite?.destroy?.({children:true});
                    mp.projectiles.splice(pi,1);
                    triggerMeteorBossVictory(hc.x,hc.y);
                    return;
                }
            }
            break;
        }
        if(!hit)continue;
        p.sprite?.parent?.removeChild(p.sprite);
        p.sprite?.destroy?.({children:true});
        mp.projectiles.splice(pi,1);
    }
}
function spawnCreatureFromDial(tier,col,row,index){
    const tp=findFreePlayPos(null)||cPos(col,row);
    const src=collI[index];
    const targetSc=gridScale(tier);
    const targetUi=uiL.toLocal(crL.toGlobal(new PIXI.Point(tp.x,tp.y)));
    let sx=collDialX,sy=collDialY,startSc=targetSc*.7;
    if(src){
        const gp=src.getGlobalPosition(new PIXI.Point());
        const lp=uiL.toLocal(gp);
        sx=lp.x;sy=lp.y;
        startSc=Math.max(.05,(src.scale.x||targetSc)*.9);
    }
    const spr=placeCr(tier,col,row,false,false,-1,tp);
    spr.spawning=true;spr.zIndex=110;spr.x=sx;spr.y=sy;spr.scale.set(startSc);spr.alpha=1;
    uiL.addChild(spr);
    const dots=spr.getChildByName?.('tapDots');if(dots)dots.visible=false;
    if(spr._shadow)spr._shadow.visible=false;
    const dx=targetUi.x-sx,dy=targetUi.y-sy;
    const dist=Math.hypot(dx,dy);
    const arcH=Math.max(cs*.42,Math.min(cs*.9,dist*.18));
    const dur=22;
    let t=0;
    const jumpTick=(dt)=>{
        if(!isLiveDisplayObject(spr)){app.ticker.remove(jumpTick);return;}
        t+=dt;
        const p=Math.min(1,t/dur);
        const ex=1-Math.pow(1-p,2.4);
        const q=Math.min(1,p*1.16);
        const arc=4*arcH*q*(1-q);
        spr.x=sx+dx*ex;
        spr.y=sy+dy*ex-arc;
        const air=Math.sin(Math.PI*Math.min(1,p*.95));
        const squash=1-air*.05;
        const stretch=1+air*.08;
        const sc=startSc+(targetSc-startSc)*ex;
        spr.scale.set(sc*stretch,sc*squash);
        if(p<1)return;
        app.ticker.remove(jumpTick);
        const landGp=spr.getGlobalPosition(new PIXI.Point());
        spr.spawning=false;spr.zIndex=1;
        crL.addChild(spr);
        if(dots)dots.visible=true;
        const landLocal=crL.toLocal(landGp);
        spr.x=landLocal.x;spr.y=landLocal.y;
        if(spr._shadow){spr._shadow.x=tp.x;spr._shadow.y=tp.y;spr._shadow.visible=true;spr._shadow.alpha=0;spr._shadow.scale.set(0);tw(spr._shadow,{alpha:.1},12,easeOQ);tw(spr._shadow.scale,{x:targetSc,y:targetSc},12,easeOB);}
        tw(spr,{x:tp.x,y:dinoDisplayY(spr,tp.y,targetSc)},3,easeOQ);
        tw(spr.scale,{x:targetSc*1.12,y:targetSc*.84},4,easeL,()=>{tw(spr.scale,{x:targetSc*.92,y:targetSc*1.08},5,easeL,()=>{tw(spr.scale,{x:targetSc,y:targetSc},6,easeOB);});});
        spawnP(partL,tp.x,tp.y+cs*.15,SPECIES[tier].color,10,{speed:3.5,life:.35,size:2.5});
        spawnP(partL,tp.x,tp.y,SPECIES[tier].accent,5,{speed:2.2,life:.28,size:1.7});
        sfx('eggDrop');
        registerCreatedDino();
        refreshAllCellAlphas();
    };
    app.ticker.add(jumpTick);
}

    S.grid[row][col]={tier,mutant,mutVar,sprite:spr,taps:0,px:pos.x,py:pos.y};

    if(tier===0){

function removeCr(col,row){

        destroyMutantSparkles(c.sprite);
        const sh=c.sprite._shadow;
        if(sh){sh.parent?.removeChild(sh);if(sh.destroyed!==true&&sh._destroyed!==true)sh.destroy();}
        c.sprite.parent?.removeChild(c.sprite);

}

function eggTap(col,row,source='manual'){
    const eSc=eggScale();
    if(S.popup)return;const c=S.grid[row][col];if(!c||c.reserved||c.merging||c.tier!==0)return;
    if(c.sprite?.spawning)return;
    if(S.tut.active&&(S.tut.stage===TUT.CRACK_1||S.tut.stage===TUT.CRACK_2)){
        const te=S.tut.targetEgg;
        if(!te||te.col!==col||te.row!==row)return;
    }
    const quickHatchActive=buffCount('quickHatch')>0;
    if(quickHatchActive){
        const pos=gridCellPos(c,col,row);
        let totalTapCoins=0;
        for(let tapIndex=c.taps;tapIndex<EGG_TAPS;tapIndex++){
            totalTapCoins+=(TAP_REWARDS[Math.min(tapIndex,TAP_REWARDS.length-1)]||0)+(S.perks.tapCoins||0)*3;
        }
        if(totalTapCoins>0)gainCoinsTagged(totalTapCoins,'egg_crack',pos.x+(Math.random()-.5)*20,pos.y-cs*.35);
        const b=S.buffs.find(v=>v.id==='quickHatch');
        if(b){
            b.count=Math.max(0,(b.count||0)-1);
            if(b.count<=0){
                const idx=S.buffs.indexOf(b);
                if(idx>=0)S.buffs.splice(idx,1);
            }
            updBuffRow();
        }
        c.taps=EGG_TAPS;
        hatchEgg(col,row,source);
        return;
    }
    c.taps++;const pos=gridCellPos(c,col,row);
    if(c.taps<EGG_TAPS)sfx('crack');else sfx('tap');
    const tapCoins=(TAP_REWARDS[Math.min(c.taps-1,TAP_REWARDS.length-1)]||0)+(S.perks.tapCoins||0)*3;
    if(tapCoins>0)gainCoinsTagged(tapCoins,'egg_crack',pos.x+(Math.random()-.5)*20,pos.y-cs*.35);
    if(c.taps>=EGG_TAPS){hatchEgg(col,row,source);}
    else{
        if(!c.sprite)return;
        c.sprite.texture=eggTex[c.taps];
        updateEggTapDots(c.sprite,c.taps);
        c.sprite._tapCrackX=0;
        c.sprite._tapCrackScaleX=1;
        c.sprite._tapCrackScaleY=1;
        tw(c.sprite,{_tapCrackX:4},2,easeL,()=>{if(c.sprite?.parent)tw(c.sprite,{_tapCrackX:-4},3,easeL,()=>{if(c.sprite?.parent)tw(c.sprite,{_tapCrackX:0},3,easeOQ);});});
        tw(c.sprite,{_tapCrackScaleX:1.12,_tapCrackScaleY:.88},3,easeL,()=>{if(c.sprite?.parent)tw(c.sprite,{_tapCrackScaleX:1,_tapCrackScaleY:1},6,easeOQ);});
        spawnP(partL,pos.x,pos.y,0xF5E6C8,2+c.taps,{speed:4,life:.3});
    }
}
function pointSegDistSq(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay;
    const lenSq=dx*dx+dy*dy;
    if(lenSq<=0.0001){
        const ox=px-ax,oy=py-ay;
        return ox*ox+oy*oy;
    }
    let t=((px-ax)*dx+(py-ay)*dy)/lenSq;
    t=Math.max(0,Math.min(1,t));
    const qx=ax+dx*t,qy=ay+dy*t;
    const ox=px-qx,oy=py-qy;
    return ox*ox+oy*oy;
}
function beginEggSwipeAt(x,y){
    S.eggSwipe={active:true,lastX:x,lastY:y,debugPts:[{x,y}],inside:{}};
}
function crackEggsAlongSwipe(ax,ay,bx,by){
    const swipeR=interactionRadius()*.9;
    const swipeRSq=swipeR*swipeR;
    const inside=S.eggSwipe?.inside||{};
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cell=S.grid[r]?.[c];
        if(!cell||cell.reserved||cell.merging||cell.tier!==0||cell.sprite?.spawning)continue;
        const key=c+','+r;
        const pos=gridCellPos(cell,c,r);
        const isInside=pointSegDistSq(pos.x,pos.y,ax,ay,bx,by)<=swipeRSq;
        if(isInside){
            if(!inside[key]){
                eggTap(c,r);
                inside[key]=true;
            }
        }else{
            inside[key]=false;
        }
    }
}
function eggPointerDown(e,col,row){
    if(SWIPE_CRACKING_ALLOWED){
        const p=e.getLocalPosition(crL);
        beginEggSwipeAt(p.x,p.y);
        if(S.eggSwipe?.inside)S.eggSwipe.inside[col+','+row]=true;
    }
    eggTap(col,row);
}

function hatchEgg(col,row,source='manual'){

    const fl=new PIXI.Graphics();fl.beginFill(0xFFFFFF,.7);fl.drawCircle(0,0,cs*.5);fl.endFill();fl.x=pos.x;fl.y=pos.y;partL.addChild(fl);

        S.grid[row][col]=null;
        const hatchTier=cur.luckyTier?Math.max(1,Math.min(cur.luckyTier,SPECIES.length-1)):(S.powerHatchEggs>0?Math.max(1,Math.min(S.powerHatchTier||2,SPECIES.length-1)):1);
        if(S.powerHatchEggs>0){
            S.powerHatchEggs=Math.max(0,S.powerHatchEggs-1);
            if(S.powerHatchEggs<=0)S.powerHatchTier=1;
            updBuffRow();
        }
        const spawnPos=resolveFreshPlaySpawnPos(pos,null);
        placeCr(hatchTier,col,row,true,false,-1,spawnPos);
        if(S.powerIntro)S.powerIntro.lastHatchAt=performance.now();
        grantTierReward(hatchTier,spawnPos.x,spawnPos.y-cs*.4);discover(hatchTier);registerCreatedDino();
        if(S.tut.active){
            if(S.tut.stage===TUT.CRACK_1){
                S.tut.firstHatch={col,row};S.tut.targetEgg=null;tutSetStage(TUT.EGG_2);
            }else if(S.tut.stage===TUT.CRACK_2){
                S.tut.secondHatch={col,row};S.tut.targetEgg=null;tutSetStage(TUT.MERGE);
            }
        }
    },150/evolutionGameplaySpeedMult());
}

function currentEggTextureForSprite(spr){
    if(!spr||spr.tierData?.tier!==0)return creatureTexture(0,false,-1);
    if(spr.tierData?.location==='grid'){
        const cell=S.grid[spr.tierData.row]?.[spr.tierData.col];
        const taps=Math.max(0,Math.min(EGG_TAPS-1,cell?.taps||0));
        return eggTex[taps]||eggTex[0]||creatureTexture(0,false,-1);
    }
    return eggTex[0]||creatureTexture(0,false,-1);
}
function setDragTex(spr,tier,mutant=false,mutVar=-1){
    spr.texture=tier===0?currentEggTextureForSprite(spr):creatureTexture(tier,mutant,mutVar);
}
function setNormalTex(spr,tier,mutant=false,mutVar=-1){
    if(!spr||spr.destroyed)return;

    if(S.discovered.has(tier))return;
    S.discovered.add(tier);
    if(tier>=1){
        GameEvents.progressComplete('species',speciesEventWhat(tier));
        if(tier<SPECIES.length-1)GameEvents.progressStart('species',speciesEventWhat(tier+1));
    }
    S.dexCounts[tier]=1;
    updColl();
    if(S.tut.active)return;
    if(SHOW_CAVE_HUMANS&&!CAVE_HUMANS_VISUAL_ONLY&&tier===3&&S.tut.done&&!S.tut.caveDone){
        const target=findFirstTier3GridCell();
        if(target){startCaveTutorial(target.col,target.row);}
    }
    sfx('discover');
    queueDiscovery(tier);
    if(!METEOR_PLAY&&tier===SPECIES.length-1&&!S.ageCompleted){
        S.ageCompleted=true;
        markTimelineCompleted(AGE_MODE);
        S.pendingEndgamePopup=true;
        GameEvents.progressComplete('age',currentAgeEventWhat());
        saveGame();
    }
}
function currentAgeEventWhat(){return AGE_MODE;}
function speciesEventWhat(tier){return `${currentAgeEventWhat()}-${String(tier).padStart(2,'0')}`;}
function startCurrentSpeciesProgress(){
    for(let tier=1;tier<SPECIES.length;tier++){

        }
    }
}
function startCurrentAgeProgress(){
    if(S.ageCompleted||(METEOR_PLAY&&ensureMeteorPlayState().bossDefeated))return;
    GameEvents.progressStart('age',currentAgeEventWhat());
}

    const count=SPECIES.length-1;
    const a=-Math.PI*.5+((Math.PI*2)/count)*stepIndex;
    const r=collDialR+34;
    luckyArrow.x=collDialX+Math.cos(a)*r;
    luckyArrow.y=collDialY+Math.sin(a)*r;
    luckyArrow.rotation=a+Math.PI*1.5;
}

function showActivePop(btn,msg){
    if(!btn||!btn.parent)return;
    if(btn._activePop){
        btn._activePop.parent?.removeChild(btn._activePop);
        btn._activePop.destroy();
        btn._activePop=null;
    }
    const p=new PIXI.Text(msg||'ACTIVE',{
        fontFamily:GAME_FONT,
        fontSize:11*UI,
        fontWeight:'bold',
        fill:'#FFFFFF',
        stroke:'#000000',
        strokeThickness:3*UI,
        dropShadow:true,
        dropShadowColor:'#000000',
        dropShadowDistance:2*UI,
        dropShadowBlur:0,

    });

    p.y=cardLike?(-(btn._h||0)/2-18*UI):((btn._label?.y??(-btn._h*.2))-14*UI);

        if(!popAlive())return;

            if(btn._activePop===p)btn._activePop=null;
            if(!p.destroyed){p.parent?.removeChild(p);p.destroy();}
        });
    });
    if(popAlive()){
        tw(p.scale,{x:1.06,y:1.06},6,easeOB,()=>{ 
            if(popAlive())tw(p.scale,{x:1,y:1},8,easeOQ);
        });
    }
}

function rainbowColorAt(t){
    const r=Math.round(128+127*Math.sin(t));
    const g=Math.round(128+127*Math.sin(t+2.094));
    const b=Math.round(128+127*Math.sin(t+4.188));
    return (r<<16)|(g<<8)|b;
}
function triggerAutomationRewardFx(card){

    }

    }

    const toastTotalMs=1050;
    const toastText=card.id==='eggDiscount'
        ? ('-'+Math.round((1-Math.pow(.85,S.perks.eggDiscount||0))*100)+'%')
        : ('+'+info.count);

        setTimeout(()=>tw(label,{alpha:0},16,easeOQ,()=>{
            if(btn._rewardLabel===label)btn._rewardLabel=null;
            label.parent?.removeChild(label);
            label.destroy();
        }),Math.max(0,labelTotalMs-((8+16)/60)*1000));
    });
    tw(label.scale,{x:1.04,y:1.04},8,easeOB,()=>{if(label.parent)tw(label.scale,{x:1,y:1},10,easeOQ);});

    const plus=new PIXI.Text(toastText,popupTextStyle(18*UI,'#FFD600','#000000',3*UI));
    plus.anchor.set(.5);

    plus.y=0;
    plus.alpha=0;
    plus.scale.set(.7);

        setTimeout(()=>tw(plus,{alpha:0,y:-48*UI},14,easeOQ,()=>{
            if(btn._rewardPlus===plus)btn._rewardPlus=null;
            plus.parent?.removeChild(plus);
            plus.destroy();
        }),Math.max(0,toastTotalMs-((8+14)/60)*1000));
    });
    tw(plus.scale,{x:1.1,y:1.1},8,easeOB,()=>{if(plus.parent)tw(plus.scale,{x:1,y:1},10,easeOQ);});

    const baseScale=btn._baseScale||1;
    const start=performance.now();
    const durMs=2000;
    const tick=()=>{
        if(!btn.parent){
            app.ticker.remove(tick);
            if(btn._rewardFxTick===tick)btn._rewardFxTick=null;
            return;
        }
        const p=Math.min(1,(performance.now()-start)/durMs);
        const wave=Math.sin(p*Math.PI*8);
        const pulse=1+Math.max(0,wave)*.1*(1-p*.35);
        btn.scale.set(baseScale*pulse,baseScale*pulse);
        if(btn._face&&btn._face.tint!==undefined)btn._face.tint=rainbowColorAt(p*Math.PI*8);
        if(p>=1){
            app.ticker.remove(tick);
            if(btn._rewardFxTick===tick)btn._rewardFxTick=null;
            btn.scale.set(baseScale,baseScale);
            if(btn._face&&btn._face.tint!==undefined)btn._face.tint=btn._origBaseColor||0xFFFFFF;
        }
    };
    btn._rewardFxTick=tick;
    app.ticker.add(tick);
}

function weightedPick(list){
    const weights={common:50,rare:35,epic:15};
    const total=list.reduce((s,c)=>s+(c?._pickWeight??weights[c.rarity]??1),0);
    let roll=Math.random()*Math.max(1,total);
    for(const c of list){
        roll-=(c?._pickWeight??weights[c.rarity]??1);
        if(roll<=0)return c;
    }
    return list[0]||null;
}

function availableCards(){

        if(card.id==='luckyHatchEpic'&&!S.discovered.has(4))return false;

function drawMilestoneCards(){
    const basePool=availableCards();
    const finalizePicked=(picked)=>{
        const hasEpic=picked.some(card=>card.rarity==='epic');
        let gatedId='';
        if(!hasEpic){
            const gated=picked.filter(shouldAdGateCard);
            if(gated.length>0)gatedId=gated[(Math.random()*gated.length)|0].id;
        }
        return picked.map(card=>({...card,_adGate:card.rarity==='epic'||card.id===gatedId}));
    };
    const pickThreeFromPool=(pool)=>{
        const withoutExtraEpics=()=>picked.some(card=>card.rarity==='epic')
            ? pool.filter(v=>!picked.includes(v)&&v.rarity!=='epic')
            : pool.filter(v=>!picked.includes(v));
        const picked=[];
        const perms=pool.filter(c=>c.kind==='perm');
        const temps=pool.filter(c=>c.kind==='temp');
        const a=weightedPick(perms);if(a)picked.push(a);
        const b=weightedPick((picked.some(card=>card.rarity==='epic')?temps.filter(c=>!picked.includes(c)&&c.rarity!=='epic'):temps.filter(c=>!picked.includes(c))));if(b)picked.push(b);
        const c=weightedPick(withoutExtraEpics());if(c)picked.push(c);
        while(picked.length<3){
            const extra=weightedPick(withoutExtraEpics());
            if(!extra)break;
            picked.push(extra);
        }
        return finalizePicked(picked);
    };
    const strongPoolIds=[
        'mutationSpark',
        'mutationSurge',
        'mutationFrenzy',
        'wildMutation',
        'mutationGene',
        'mutationGeneEpic',
        'autoHatchPlus2',
        'assistPlus2',
        'boostPlus2',
        'luckySpinUnlock'
    ];
    const strongPool=basePool
        .filter(card=>strongPoolIds.includes(card.id))
        .map(card=>({
            ...card,
            _pickWeight:{
                mutationSpark:2,
                mutationSurge:2,
                mutationFrenzy:2,
                wildMutation:2,
                mutationGene:2,
                mutationGeneEpic:2,
                eggStorm:2,
                luckySpinUnlock:2
            }[card.id]||1
        }));
    return pickThreeFromPool(strongPool.length?strongPool:basePool);
}

function triggerEggStorm(){

    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++)if(!S.grid[r][c])empties.push({col:c,row:r,pos:gridCellPos(null,c,r)});
    if(!empties.length)return;
    empties.sort((a,b)=>{
        const ay=a.pos.y*1000+Math.abs(a.pos.x-(gX+totalGridW/2));
        const by=b.pos.y*1000+Math.abs(b.pos.x-(gX+totalGridW/2));
        return ay-by;
    });
    playEggStormBurstFx();
    const reserved=[];
    for(const cell of empties){
        if(reserveCell(cell.col,cell.row))reserved.push(cell);
    }
    reserved.forEach((cell,i)=>spawnStormEggAt(cell.col,cell.row,i*75));
    refreshAllCellAlphas();
}
function pickWildMutationTarget(){
    const gridNormal=[],gridAll=[],nestNormal=[],nestAll=[];
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r][c];
        if(!cl||cl.reserved||cl.merging||cl.tier<1||!cl.sprite)continue;
        gridAll.push({type:'grid',r,c,cell:cl,sprite:cl.sprite});
        if(!cl.mutant)gridNormal.push({type:'grid',r,c,cell:cl,sprite:cl.sprite});
    }
    for(let i=0;i<NEST_COUNT;i++){
        const n=S.nests[i];
        if(!n||n.tier<1||n.merging||!n.sprite)continue;
        nestAll.push({type:'nest',index:i,cell:n,sprite:n.sprite});
        if(!n.mutant)nestNormal.push({type:'nest',index:i,cell:n,sprite:n.sprite});
    }
    const pool=gridNormal.length?gridNormal:(gridAll.length?gridAll:(nestNormal.length?nestNormal:nestAll));
    if(!pool.length)return null;
    const pick=pool[(Math.random()*pool.length)|0];
    const cell=pick.cell;
    const pos=pick.type==='nest'
        ? {x:nPos(pick.index).x,y:nPos(pick.index).y+(cell.spriteYOffset||-cs*.1)}
        : gridCellPos(cell,pick.c,pick.r);
    return {...pick,pos};
}
function triggerWildMutation(){
    const pick=arguments[0]||pickWildMutationTarget();
    if(!pick)return false;
    const cell=pick.cell;
    const spr=pick.sprite;
    const baseScale=pick.type==='nest'?nestScale(cell.tier):gridScale(cell.tier);
    const pos=pick.pos||(pick.type==='nest'
        ? {x:nPos(pick.index).x,y:nPos(pick.index).y+(cell.spriteYOffset||-cs*.1)}
        : gridCellPos(cell,pick.c,pick.r));
    const prevVar=cell.mutant?(cell.mutVar??-1):-1;
    let mutVar=randomMutVar();
    if(cell.mutant&&MUTANT_VARIANTS>1&&mutVar===prevVar){
        mutVar=(mutVar+1+((Math.random()*(MUTANT_VARIANTS-1))|0))%MUTANT_VARIANTS;
    }
    if(spr){
        tw(spr.scale,{x:baseScale*.86,y:baseScale*1.16},7,easeL);

        if(pick.type==='nest')cell.prodTime=SPECIES[cell.tier].prodBase*.5;
        if(spr){
            spr.tierData.mutant=true;

function applyCardEffect(card){

        case 'mutationGeneEpic': S.perks.mutationGene=(S.perks.mutationGene||0)+.25; break;
        case 'mutationSpark': addBuff('mutationSpark'); break;
        case 'mutationSurge': addBuff('mutationSurge'); break;
        case 'mutationFrenzy': addBuff('mutationFrenzy'); break;
        case 'wildMutation': triggerWildMutation(); break;
        case 'eggStorm': triggerEggStorm(); break;
        case 'doubleCoin': addBuff('doubleCoin',card.duration||90); break;
        case 'nestTurbo': addBuff('nestTurbo',card.duration||60); break;
        case 'autoHatchPlus': S.powerAd.hatchCharges=(S.powerAd.hatchCharges||0)+1; break;
        case 'assistPlus': S.powerAd.assistCharges=(S.powerAd.assistCharges||0)+1; break;
        case 'boostPlus': S.powerAd.speedCharges=(S.powerAd.speedCharges||0)+1; break;
        case 'autoHatchPlus2': S.powerAd.hatchCharges=(S.powerAd.hatchCharges||0)+2; break;
        case 'assistPlus2': S.powerAd.assistCharges=(S.powerAd.assistCharges||0)+2; break;
        case 'boostPlus2': S.powerAd.speedCharges=(S.powerAd.speedCharges||0)+2; break;

function updMilestoneSystem(dt){
    let buffChanged=false;
    for(let i=S.buffs.length-1;i>=0;i--){
        if(typeof S.buffs[i].remaining==='number'){
            S.buffs[i].remaining-=dt/60;
            if(S.buffs[i].remaining<=0){S.buffs.splice(i,1);buffChanged=true;}
        }else if(typeof S.buffs[i].count==='number'&&S.buffs[i].count<=0){
            S.buffs.splice(i,1);buffChanged=true;
        }
    }
    if(buffChanged||S.buffs.length)updBuffRow();
    if(S.chainMerges>0&&!S.popup){
        S.chainMergeTick=(S.chainMergeTick||0)+dt/60;
        if(S.chainMergeTick>=.18){
            S.chainMergeTick=0;
            const pair=findMergePair();
            if(pair)autoMerge();
            else{S.chainMerges=Math.max(0,S.chainMerges-1);}
        }
    }else S.chainMergeTick=0;
    updMilestoneHud();
    processModalQueue();
}

function hasGridEgg(){

        const t=S.grid[r][c].tier;

    }

}
function hasAnyMergePair(){

        if(!cellIsMergeable(r,c))continue;
        const t=S.grid[r][c].tier;
        counts[t]=(counts[t]||0)+1;
        if(counts[t]>=2)return true;
    }

function layoutPowerButtonStack(animate=false){
    const all=POWER_INTRO_ORDER.map(key=>({key,btn:powerButtonForKey(key)})).filter(v=>v.btn);
    if(!all.length)return;
    const tutReady=!S.tut.active&&S.tut.done;
    syncBoostButtonModePresentation();
    if(!METEOR_PLAY){
        for(const {btn} of all){
            const slot=btn._fullPowerSlot;
            if(!slot)continue;
            if(btn._w!==slot.w||btn._h!==slot.h)relayoutPowerBtn(btn,slot.w,slot.h);
            setPowerBtnTextScale(btn,1);
            btn._baseScale=slot.scale||1;
            btn._label.text=btn._shortLabel||btn._label.text;
            btn.visible=tutReady&&!S.popup;
            btn.alpha=1;
            if(animate){tw(btn,{x:slot.x,y:slot.y},14,easeOB);tw(btn.scale,{x:btn._baseScale,y:btn._baseScale},14,easeOB);}
            else{btn.x=slot.x;btn.y=slot.y;btn.scale.set(btn._baseScale);}
        }
        return;
    }
    const permanent=all.filter(v=>isPowerUnlocked(v.key));
    const fullSlots=all.map(v=>v.btn._fullPowerSlot).filter(Boolean);
    const center=fullSlots[1]||fullSlots[0];
    const step=center&&fullSlots[2]?{x:fullSlots[2].x-center.x,y:fullSlots[2].y-center.y}:{x:90*UI,y:0};
    const portraitPermanent=!isScreenLandscape();
    const managementPermanent=portraitPermanent?permanent.filter(v=>v.key==='hatch'||v.key==='assist'):[];
    for(let i=0;i<permanent.length;i++){
        const {key,btn}=permanent[i];
        if(!center)continue;
        const slot=btn._fullPowerSlot;
        const boostLayout=portraitPermanent&&key==='speed'?portraitBoostPermanentLayout(btn):null;
        const desiredW=boostLayout?.w||(portraitPermanent&&(key==='hatch'||key==='assist')?slot.w*1.5:slot?.w);
        const desiredH=boostLayout?.h||slot?.h;
        if(desiredW&&desiredH&&(btn._w!==desiredW||btn._h!==desiredH)){
            const prevScale={x:btn.scale.x,y:btn.scale.y};
            relayoutPowerBtn(btn,desiredW,desiredH);
            if(animate)btn.scale.set(prevScale.x,prevScale.y);
        }
        setPowerBtnTextScale(btn,1);
        let target;
        if(boostLayout)target={x:boostLayout.x,y:boostLayout.y};
        else if(portraitPermanent&&(key==='hatch'||key==='assist')){
            const managementIndex=managementPermanent.findIndex(v=>v.key===key);
            const offset=managementIndex-(managementPermanent.length-1)*.5;
            const managementStep=desiredW*(slot?.scale||1)+12*UI;
            target={x:center.x+managementStep*offset,y:center.y};
        }else{
            const offset=i-(permanent.length-1)*.5;
            target={x:center.x+step.x*offset,y:center.y+step.y*offset};
        }
        const sc=boostLayout?.scale||btn._fullPowerSlot?.scale||btn._baseScale||1;
        btn._baseScale=sc;
        btn._label.text=btn._shortLabel||btn._label.text;
        btn.visible=tutReady&&!S.popup&&(key!=='speed'||shouldShowBoostButton());
        btn.alpha=1;
        if(animate){tw(btn,{x:target.x,y:target.y},14,easeOB);tw(btn.scale,{x:sc,y:sc},14,easeOB);}
        else{btn.x=target.x;btn.y=target.y;btn.scale.set(sc);}
    }
    for(const {key,btn} of all){
        if(isPowerUnlocked(key))continue;
        if(isPowerContextual(key)&&tutReady){
            const pos=contextualPowerButtonPosition(key);
            if(btn._w!==pos.w||btn._h!==pos.h)relayoutPowerBtn(btn,pos.w,pos.h);
            setPowerBtnTextScale(btn,pos.textScale);
            btn._baseScale=pos.scale;
            btn._label.text=btn._introLabel||btn._label.text;
            btn.visible=true;
            btn.x=pos.x;btn.y=pos.y;
            if(!animate)btn.scale.set(pos.scale);
        }else{

            btn.visible=false;
            btn._label.text=btn._shortLabel||btn._label.text;
        }

function updLuckySpin(dt){
    if(!S.luckySpin.active)return;
    S.luckySpin.t+=dt/60;
    const p=Math.min(1,S.luckySpin.t/Math.max(.01,S.luckySpin.dur));
    const eased=1-Math.pow(1-p,3);
    const raw=S.luckySpin.start+(S.luckySpin.end-S.luckySpin.start)*eased;
    const count=SPECIES.length-1;
    const cur=((raw%count)+count)%count;
    const stepNow=Math.floor(raw);
    if(stepNow>(S.luckySpin.step??stepNow)){
        S.luckySpin.step=stepNow;
        sfx('luckyStep');
    }
    S.luckySpin.index=cur;
    if(luckyArrow)setLuckyArrowPos(cur);
    if(p<1)return;

    S.luckySpin.active=false;
    const stopIndex=((S.luckySpin.target%count)+count)%count;
    S.luckySpin.index=stopIndex;
    if(luckyArrow)luckyArrow.visible=false;
    const tier=stopIndex+1;
    if(!S.discovered.has(tier)){
        shakeBtnOnly(luckyB);
        updAllBtns();
        return;
    }
    const cell=findEmpty();
    if(!cell||!reserveCell(cell.col,cell.row)){
        shakeBtnOnly(luckyB);
        updAllBtns();
        return;
    }
    let tp=eggSpawnPosForCell(cell.col,cell.row,null,'generic');
    const egg=placeCr(0,cell.col,cell.row,false,false,-1,tp);
    markLuckyEgg(cell.col,cell.row,tier);
    egg.spawning=true;
    egg.zIndex=110;
    const src=collI[stopIndex];
    let sx=collDialX,sy=collDialY,startSc=eggScale()*.72;
    if(src){
        const gp=src.getGlobalPosition(new PIXI.Point());
        const lp=uiL.toLocal(gp);

        startSc=Math.max(.05,(src.scale.x||startSc)*.75);
    }
    egg.x=sx;egg.y=sy;egg.scale.set(startSc);egg.alpha=1;
    uiL.addChild(egg);
    if(egg._shadow)egg._shadow.visible=false;
    const targetUi=uiL.toLocal(crL.toGlobal(new PIXI.Point(tp.x,tp.y)));
    const dx=targetUi.x-sx,dy=targetUi.y-sy;
    const dist=Math.hypot(dx,dy);
    const arcH=Math.max(cs*.42,Math.min(cs*.9,dist*.18));
    let t=0;
    const dur=22;
    const flyTick=(dt)=>{
        if(!egg||!egg.parent){app.ticker.remove(flyTick);return;}
        t+=dt;
        const p=Math.min(1,t/dur);
        const ex=1-Math.pow(1-p,2.4);
        const q=Math.min(1,p*1.16);
        const arc=4*arcH*q*(1-q);
        egg.x=sx+dx*ex;
        egg.y=sy+dy*ex-arc;
        const air=Math.sin(Math.PI*Math.min(1,p*.95));
        const squash=1-air*.05;
        const stretch=1+air*.08;
        const sc=startSc+(eggScale()-startSc)*ex;
        egg.scale.set(sc*stretch,sc*squash);
        if(p<1)return;
        app.ticker.remove(flyTick);
        const landGp=egg.getGlobalPosition(new PIXI.Point());
        tp=resolveFreshPlaySpawnPos(latestCellPlayPosForSprite(cell.col,cell.row,egg,tp),egg);
        updateCellPlayPosForSprite(cell.col,cell.row,egg,tp);
        egg.spawning=false;egg.zIndex=1;
        crL.addChild(egg);
        const landLocal=crL.toLocal(landGp);
        egg.x=landLocal.x;egg.y=landLocal.y;
        if(egg._shadow){egg._shadow.x=tp.x;egg._shadow.y=tp.y;egg._shadow.visible=true;egg._shadow.alpha=0;egg._shadow.scale.set(0);tw(egg._shadow,{alpha:.1},12,easeOQ);tw(egg._shadow.scale,{x:eggScale(),y:eggScale()},12,easeOB);}
        tw(egg,{x:tp.x,y:tp.y},3,easeOQ);
        tw(egg.scale,{x:eggScale()*1.12,y:eggScale()*.84},4,easeL,()=>{tw(egg.scale,{x:eggScale()*.92,y:eggScale()*1.08},5,easeL,()=>{tw(egg.scale,{x:eggScale(),y:eggScale()},6,easeOB);});});
        spawnP(partL,tp.x,tp.y+cs*.12,0xFFF59D,8,{speed:2.8,life:.38,size:2});

        sfx('eggDrop');
        refreshAllCellAlphas();
    };
    app.ticker.add(flyTick);
    updAllBtns();
}

function triggerAutoHatchPass(){
    if(!S.autoHatch.active||S.autoHatch.remaining<=0)return false;
    const isValidTarget=(target)=>{
        const cell=S.grid[target.row]?.[target.col];
        return !!(cell&&!cell.reserved&&!cell.merging&&cell.tier===0&&!cell.sprite?.spawning);
    };
    S.autoHatch.targets=(S.autoHatch.targets||[]).filter(isValidTarget);
    const targetKeys=new Set(S.autoHatch.targets.map(target=>target.col+','+target.row));
    const targetLimit=Math.max(0,S.autoHatch.remaining|0);
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        if(S.autoHatch.targets.length>=targetLimit)break;
        const key=c+','+r;
        const cell=S.grid[r]?.[c];
        if(targetKeys.has(key)||!cell||cell.reserved||cell.merging||cell.tier!==0||cell.sprite?.spawning)continue;
        S.autoHatch.targets.push({col:c,row:r});
        targetKeys.add(key);
    }
    let tapped=false;
    for(const target of [...S.autoHatch.targets]){
        if(!S.autoHatch.active||S.autoHatch.remaining<=0)break;
        if(!isValidTarget(target))continue;
        eggTap(target.col,target.row,'auto-hatch');
        tapped=true;
    }
    S.autoHatch.armed=!tapped;
    return tapped;
}

function findMergePair(){

function autoMerge(){

    const sx=spr.x,sy=spr.y;
    const dur=evolutionBoostedDuration(12);
    const apex=Math.max(14*UI,Math.abs(tx-sx)*.14,cs*.3);

    let t=0;
    const jumpTick=(dt)=>{

        t=Math.min(1,t+dt/dur);
        const e=easeIOQ(t);
        spr.x=sx+(tx-sx)*e;
        const arc=4*t*(1-t);
        spr.y=sy+(ty-sy)*e-apex*arc;
        if(t>=1){
            app.ticker.remove(jumpTick);
            removeCr(pair.a.col,pair.a.row);removeCr(pair.b.col,pair.b.row);
            spawnP(partL,tx,ty,SPECIES[nt].color,14,{speed:5,life:.4,size:3});if(res.mutated)spawnMutantFlash(tx,ty);sfx('merge');mergeFlash(tx,ty);

const coinPops=[];
function coinPop(x,y,amt,opts){
    opts=opts||{};

    if(!value)return;
    sfx('coin');

    const fill=opts.fill||(neg?'#FF8A80':'#FFD600');
    const t=new PIXI.Text(prefix+value,{fontFamily:GAME_FONT,fontSize:16*UI,fontWeight:'bold',fill,stroke:'#5D4037',strokeThickness:3*UI,dropShadow:true,dropShadowColor:'#5D4037',dropShadowDistance:1.5*UI,dropShadowBlur:0,dropShadowAngle:Math.PI/4});
    t.eventMode='none';

    t.anchor.set(.5);t.x=x;t.y=y;t._y0=y;
    t.vx=(Math.random()-.5)*(1.1*UI);
    t.vy=-(4.4+Math.random()*1.6)*UI*.5;
    t.g=.20*UI;
    t.spin=(Math.random()-.5)*.02;
    const flight=Math.max(24,(Math.abs(t.vy)/Math.max(.0001,t.g))*2);
    t.life=0;t.maxLife=flight+18;
    uiL.addChild(t);coinPops.push(t);
}
function updCoinPops(dt){
    for(let i=coinPops.length-1;i>=0;i--){
        const p=coinPops[i];
        if(!p||p.destroyed||!p.parent){if(p&&!p.destroyed)p.destroy();coinPops.splice(i,1);continue;}
        p.life+=dt;
        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vy+=p.g*dt;
        p.rotation+=p.spin*dt;
        const fadeStart=p.maxLife*.55;
        if(p.life>fadeStart)p.alpha=Math.max(0,1-(p.life-fadeStart)/(p.maxLife-fadeStart));
        if(p.life>=p.maxLife||p.y>p._y0+18*UI){p.parent?.removeChild(p);p.destroy();coinPops.splice(i,1);}
    }
}

function mkCardDescRun(parts,descCol,gap=.5*UI){

// ============================================================
function updBob(dt){
    S.idle+=dt*.03;
    if(collI?.length){
        const dexTier=S.dexHover?.tier||-1;
        for(let i=0;i<collI.length;i++){
            const ic=collI[i];
            if(!ic||ic.destroyed)continue;
            const base=collBaseIconScale();
            const target=(ic._tier===dexTier)?base*(1.18+Math.sin(S.idle*16)*.04):base;
            ic.scale.x+=(target-ic.scale.x)*.22;
            ic.scale.y+=(target-ic.scale.y)*.22;
        }
    }
    if(isLiveDisplayObject(S.drag)){
        const spr=S.drag;
        if(spr._pendingEggDrag){
            spr._dragLift=0;
        }else{
        spr._dragLift=spr._dragLift??0;
        spr._dragLiftTarget=spr._dragLiftTarget??DRAG_LIFT;
        spr._dragAimX=spr._dragAimX??spr.x;
        spr._dragAimY=spr._dragAimY??spr.y;
        spr._dragLift+=(spr._dragLiftTarget-spr._dragLift)*.22;
        if(spr._dexSnapped){
            spr.x=spr._dragAimX;
            spr.y=spr._dragAimY;
        }else{
            spr.x+=(spr._dragAimX-spr.x)*.3;
            spr.y+=(spr._dragAimY-spr.y)*.3;
        }
        if(isLiveDisplayObject(S.hoverTarget?.sprite)&&spr.tierData?.tier>=1){
            const pull=(spr._mergeAnticipationPull||0);
            if(pull>0){
                const tx=S.hoverTarget.sprite.x,ty=S.hoverTarget.sprite.y;
                const dx=tx-spr.x,dy=ty-spr.y;
                const len=Math.max(1,Math.hypot(dx,dy));
                const nx=dx/len,ny=dy/len;
                const pullAmt=cs*.14*pull;
                const pulse=1+Math.sin(S.idle*10)*.032*pull;
                spr.x+=nx*pullAmt;
                spr.y+=ny*pullAmt;
                const baseSc=spr.tierData.location==='nest'?nestScale(spr.tierData.tier||0):gridScale(spr.tierData.tier||0);
                spr.scale.set(baseSc*(1+.11*pull)*pulse*(spr._voiceScaleX??1),baseSc*(1-.065*pull)/pulse*(spr._voiceScaleY??1));
                spr.y-=voiceAnchorYOffset(spr,baseSc*(1-.065*pull)/pulse);
            }
        }
        moveDragShadow(spr.x,spr.y,spr._dragLift||0);
        }
    }
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++){
        const cl=S.grid[r][c];
        if(!cl||cl.reserved||!isLiveDisplayObject(cl.sprite)||cl.sprite===S.drag||cl.sprite.spawning||cl.merging)continue;
        const spr=cl.sprite;
        const bp=gridCellPos(cl,c,r),sh=spr._shadow;
        const targetCueScale=spr._dragCueTargetScaleMul||1;
        spr._dragCueScaleMul=(spr._dragCueScaleMul??1)+(targetCueScale-(spr._dragCueScaleMul??1))*.12;
        const cueScale=spr._dragCueScaleMul||1;
        const cueRot=spr._dragCueRot||0;
        const cueLift=spr._dragCueLift||0;
        spr._mergeAnticipationPull=(spr._mergeAnticipationPull||0)+(((S.hoverTarget?.sprite===spr)?(S.drag?S.drag._mergeAnticipationPull||0:0):0)-(spr._mergeAnticipationPull||0))*.18;
        const targetAlpha=spr._dragCueTargetAlpha??1;
        spr.alpha=(spr.alpha??1)+(targetAlpha-(spr.alpha??1))*.12;
        spr.filters=null;
        if(spr._dragCueMerge&&S.hoverTarget?.sprite!==spr){
            spr._dragCuePartTick=(spr._dragCuePartTick||0)+dt;
            if(spr._dragCuePartTick>=5){
                spr._dragCuePartTick=0;
                emitDragCueMergeParticles(spr,S.drag?.tierData?.tier||0);
            }
        }else spr._dragCuePartTick=0;
        if(cl.tier===0){
            const crackX=spr._tapCrackX||0;
            const crackScaleX=spr._tapCrackScaleX||1;
            const crackScaleY=spr._tapCrackScaleY||1;
            if(cl.luckyTier){
                const wobble=Math.sin(S.idle*6+spr.bobOff);
                const squash=1+wobble*.045;
                const stretch=1-wobble*.035;
                const sc=eggScale()*cueScale;
                spr.scale.set(sc*squash*crackScaleX*(spr._voiceScaleX??1),sc*stretch*crackScaleY*(spr._voiceScaleY??1));
                spr.rotation=cueRot+wobble*.08;
            }else{
                spr.rotation=cueRot;
                spr.scale.set(eggScale()*cueScale*crackScaleX*(spr._voiceScaleX??1),eggScale()*cueScale*crackScaleY*(spr._voiceScaleY??1));
            }
            spr.x=bp.x+crackX;
            spr.y=dinoDisplayY(spr,bp.y-cueLift,eggScale()*cueScale*crackScaleY*(spr._voiceScaleY??1));
        } else {
            // Breathing: scale oscillation, no y movement
            const breath=1+Math.sin(S.idle+spr.bobOff)*.03;
            const pull=spr._mergeAnticipationPull||0;
            const pulse=1+Math.sin(S.idle*11+spr.bobOff)*.038*pull;
            const sc=gridScale(cl.tier)*breath*cueScale*(1+.14*pull);
            const scY=sc*(1-.075*pull)/pulse*(spr._voiceScaleY??1);
            spr.scale.set(sc*pulse*(spr._voiceScaleX??1),scY);
            let py=bp.y-cueLift,px=bp.x;
            py=dinoDisplayY(spr,py,scY)-voiceAnchorYOffset(spr,sc*(1-.075*pull)/pulse);
            if(pull>0&&isLiveDisplayObject(S.drag)){
                const dx=S.drag.x-bp.x,dy=S.drag.y-bp.y;
                const len=Math.max(1,Math.hypot(dx,dy));
                px+=dx/len*cs*.06*pull;
                py+=dy/len*cs*.06*pull;
            }
            spr.x=px;spr.y=py;spr.rotation=cueRot;
        }
        updateDepthByY(spr,spr.y);
        if(spr._mutSparkles){
            for(let i=0;i<spr._mutSparkles.children.length;i++){
                const a=S.idle*1.7+spr.bobOff+spr._mutSparkles._ph[i];
                const sp=spr._mutSparkles.children[i];
                sp.x=Math.cos(a)*cs*.18;sp.y=Math.sin(a)*cs*.12-cs*.12;sp.alpha=.55+.35*Math.sin(a*1.3);
            }
        }
        if(sh){sh.x=bp.x;sh.y=bp.y;}
    }
    for(let i=0;i<NEST_COUNT;i++){
        const n=S.nests[i];if(!n)continue;
        const bp=nPos(i);
        const spr=n.sprite;
        if(n.pop>0)n.pop=Math.max(0,n.pop-dt*.06);
        if((n.shotPulseT||0)>0)n.shotPulseT=Math.max(0,(n.shotPulseT||0)-dt*.06);
        const acceptHover=(S.nestAcceptHover===i);
        n.acceptScale=(n.acceptScale??1)+(((acceptHover?1.12:1))-(n.acceptScale??1))*.16;
        if(isLiveDisplayObject(spr)&&spr!==S.drag&&!n.merging){
            const targetCueScale=spr._dragCueTargetScaleMul||1;
            spr._dragCueScaleMul=(spr._dragCueScaleMul??1)+(targetCueScale-(spr._dragCueScaleMul??1))*.12;
            const cueScale=spr._dragCueScaleMul||1;
            const cueRot=spr._dragCueRot||0;
            const cueLift=spr._dragCueLift||0;
            const targetAlpha=spr._dragCueTargetAlpha??1;
            spr.alpha=(spr.alpha??1)+(targetAlpha-(spr.alpha??1))*.12;
            spr.filters=null;
            if(spr._dragCueMerge&&S.hoverTarget?.sprite!==spr){
                spr._dragCuePartTick=(spr._dragCuePartTick||0)+dt;
                if(spr._dragCuePartTick>=5){
                    spr._dragCuePartTick=0;
                    emitDragCueMergeParticles(spr,S.drag?.tierData?.tier||0);
                }
            }else spr._dragCuePartTick=0;
            const breath=1+Math.sin(S.idle*.8+spr.bobOff)*.03;
            const pulse=1+n.pop*.2;
            const fx=productionFxStrength(n.tier);
            const ns=nestScale(n.tier);
            const shotBaseScale=ns*breath*pulse*cueScale*(n.acceptScale||1);
            let shotScaleX=1,shotScaleY=1;
            const shotQ=1-Math.max(0,Math.min(1,n.shotPulseT||0));
            if(shotQ>0){
                if(shotQ<(4/15)){
                    const u=shotQ/(4/15);
                    shotScaleX=1+(.12*u);
                    shotScaleY=1-(.16*u);
                }else if(shotQ<(9/15)){
                    const u=(shotQ-(4/15))/(5/15);
                    shotScaleX=1.12+((.92-1.12)*u);
                    shotScaleY=.84+((1.08-.84)*u);
                }else{
                    const u=(shotQ-(9/15))/(6/15);
                    shotScaleX=.92+((1-.92)*u);
                    shotScaleY=1.08+((1-1.08)*u);
                }
            }
            const finalScaleY=shotBaseScale*shotScaleY*(spr._voiceScaleY??1);
            spr.scale.set(shotBaseScale*shotScaleX*(spr._voiceScaleX??1)*nestFacingSign(i),finalScaleY);
            const shotTilt=meteorNestShotTilt(i)*Math.max(0,Math.min(1,n.shotPulseT||0));
            spr.rotation=n.tilt*n.pop+cueRot+shotTilt;
            const nyOff=n.spriteYOffset||-cs*.1;
            const shotAnchorComp=((1-shotScaleY)*(spr.texture?.height||cs)*shotBaseScale)*.5;
            spr.y=dinoDisplayY(spr,bp.y+nyOff-cueLift,finalScaleY)+nestSpriteVisualYOffset(spr,finalScaleY)+shotAnchorComp-voiceAnchorYOffset(spr,shotBaseScale);
            updateDepthByY(spr,spr.y);
            if(spr._mutSparkles){
                for(let i=0;i<spr._mutSparkles.children.length;i++){
                    const a=S.idle*1.7+spr.bobOff+spr._mutSparkles._ph[i];
                    const sp=spr._mutSparkles.children[i];
                    sp.x=Math.cos(a)*cs*.2;sp.y=Math.sin(a)*cs*.12-cs*.16;sp.alpha=.55+.35*Math.sin(a*1.3);
                }
            }
            const sh=spr._shadow;if(sh){sh.x=bp.x;sh.y=bp.y;}
            if(!n.blockedNoSpace&&fx>.18){
                n.lineTick+=dt;
                const interval=22/(S.speedBoost.active?2:1);
                while(n.lineTick>=interval){
                    n.lineTick-=interval;
                    spawnNestSpeedLines(bp,n.barBg?.y||bp.y,fx,n.tier);
                }
            }else{
                n.lineTick=0;
            }
        }else{
            n.lineTick=0;
        }
        const laneThreat=meteorLaneThreatTier(i);
        const weakVsComet=METEOR_PLAY&&laneThreat>0&&(((n.tier||0)<1)||((n.tier||0)<(laneThreat-2)));
        const emptyThreatenedNest=METEOR_PLAY&&laneThreat>0&&(n.tier||0)<1;
        if(n.warnTxt){
            n.warnTxt.visible=SOFT_RELEASE_GAMEPLAY?(weakVsComet||!!n.blockedNoSpace):emptyThreatenedNest;
            if(n.warnTxt.visible){
                n.warnTxt.x=bp.x-cs*.42;
                n.warnTxt.y=bp.y;
            }
        }
        if(n.basket&&n.basket.parent){
            const bs=n.basketBaseScale||1;
            const fx=Math.max(acceptHover ? .22 : 0,productionFxStrength(n.tier));
            const prodPulse=1+Math.max(0,Math.sin(S.idle*1.1+n.tier*.6))*fx*.03;
            const s=bs*(1+n.pop*.12)*prodPulse*(1+((n.acceptScale||1)-1)*.9);
            n.basket.scale.set(s);
            n.basket.rotation=n.tilt*n.pop*.45;
        }
        if(n.basketBack&&n.basketBack.parent){
            const bs=n.basketBackBaseScale||n.basketBaseScale||1;
            const fx=Math.max(acceptHover ? .22 : 0,productionFxStrength(n.tier));
            const prodPulse=1+Math.max(0,Math.sin(S.idle*1.1+n.tier*.6))*fx*.03;
            const s=bs*(1+n.pop*.12)*prodPulse*(1+((n.acceptScale||1)-1)*.9);
            n.basketBack.scale.set(s,-s);
            n.basketBack.rotation=n.tilt*n.pop*.45;
        }
    }
}

    data.dv={...S.dexVoices};

async function ensureFontLoaded(){

function calcOffline(nests,elapsed,discovered){
    return null;
    elapsed=Math.max(0,Math.min(elapsed||0,MAX_OFFLINE_PRODUCTION_SEC));
    if(elapsed<30)return null; // need at least 30s
    const maxTier=Math.max(...discovered);
    let totalEggs=0;
    for(const n of nests){
        if(n.t<1)continue;
        const pt=SPECIES[n.t].prodBase;
        totalEggs+=Math.floor((n.tm+elapsed)/pt);
    }
    if(!totalEggs)return null;
    // Auto-hatch all eggs → tier 1, then merge pairs up the chain (capped at discovered)
    const counts={};counts[1]=totalEggs;
    let mergeCoins=0;
    for(let t=1;t<Math.min(maxTier,SPECIES.length-1);t++){
        if(!counts[t])continue;
        const pairs=Math.floor(counts[t]/2);
        counts[t]%=2;
        if(pairs){counts[t+1]=(counts[t+1]||0)+pairs;mergeCoins+=pairs*baseRewardForTier(t+1);}
    }
    const results=[];
    for(let t=1;t<SPECIES.length;t++)if(counts[t])results.push({tier:t,count:counts[t]});
    return{results,mergeCoins,totalEggs,elapsed};
}
