                queueNestImmediateShot(i,n.tier,MERGE_MOUTH_ANIM_MS+100);
            }
            S.pendingEndgamePopup=!!mp.bossDefeated;
        }
        updateNestUnlockUi();
        backfillDexCountsFromState();
        // Calculate offline production
        offline=calcOffline(saved.nests,elapsed,S.discovered);
        updCoins();updColl();
        refreshBgAnchors();
        drawGameBg();
        updateSkyComet();
        S.suppressDexVoicePlayback=false;
    } else {
        // Fresh game
        if(!METEOR_PLAY){
            S.tut.active=false;
            S.tut.done=true;
            S.tut.caveDone=true;
            S.tut.stage=TUT.DONE;
            if(S.tut.hand)S.tut.hand.visible=false;
        }else{
            tutStart();
        }
    }
    updateNestUnlockUi();
    const showingEndgamePopup=!!S.pendingEndgamePopup&&!welcomeLegacyZoo;
    let showDeferredOfflinePopup=null;
    if(showingEndgamePopup)showExtinctionAvertedPopup({onBeginNewAge:()=>{
        if(showDeferredOfflinePopup)showDeferredOfflinePopup(()=>showEvolutionChoicePopup());
        else showEvolutionChoicePopup();
    }});
    else if(!S.tut.active)tutSetButtonsVisibility(true);
    layoutPowerButtonStack(false);
    updMilestoneHud();
    updBuffRow();
    if(!showingEndgamePopup)updAllBtns();
    refreshAllCellAlphas();

    if(offline){
        // Pre-calculate placement + overflow coins
        let empties=0;
        for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<COLS;c++)if(!S.grid[r][c])empties++;
        // Offline rewards:
        // - +1 coin per offline egg
        // - Creature rewards capped to 16 total, prioritizing higher tiers
        const CREATURE_REWARD_CAP=16;
        let remaining=CREATURE_REWARD_CAP;
        const cappedResults=[];
        const byHighTier=[...offline.results].sort((a,b)=>b.tier-a.tier);
        for(const r of byHighTier){
            if(remaining<=0)break;
            const take=Math.min(r.count,remaining);
            if(take>0){
                cappedResults.push({tier:r.tier,count:take});
                remaining-=take;
            }
        }
        // Keep display order consistent (low->high tier)
        cappedResults.sort((a,b)=>a.tier-b.tier);
        offline.results=cappedResults;
        let creatureCoins=0;
        for(const r of offline.results)creatureCoins+=r.count*baseRewardForTier(r.tier);
        const eggCoins=offline.totalEggs;
        const eggsToPlace=Math.min(offline.totalEggs,empties);
        const totalCoins=eggCoins+creatureCoins;
        showDeferredOfflinePopup=(onClose=null)=>showOfflinePopup(offline,totalCoins,()=>{
            for(let i=0;i<eggsToPlace;i++){
                const cell=findEmpty();
                if(cell)placeCr(0,cell.col,cell.row,true);
            }
            S.coins+=totalCoins;
            updCoins();updAllBtns();refreshAllCellAlphas();
        },onClose);
    }
    if(!welcomeLegacyZoo&&!showingEndgamePopup)showDeferredOfflinePopup?.();
    // Game loop
    app.ticker.add((dt)=>{
        updTw(dt);updP(dt);updCoinPops(dt);updConfetti(dt);
        const gameDt=dt;
        if(!isGameSimulationPaused()){
            updNests(gameDt);updateMeteorPlay(gameDt);updateMeteorSky(gameDt);updPowerIntroductions();updPowerButtonAttentionPulse();updBob(gameDt);updAutoHatch(gameDt);updSpeedBoost(gameDt);updateNestBoosters(gameDt);updAssist(gameDt);updHoverParticles(gameDt);updLuckySpin(gameDt);syncLuckyDialHighlight();updMilestoneSystem(gameDt);updLowIncomeNestAssist(gameDt);updTut(gameDt);maybeStartCaveTutorial();updCaveVisit(gameDt);updOverlapDebug();
            S.devTools?.updateEconDebug?.();
            updCollisionDebug();updScreenShake(dt);
        }
    });
    // Auto-save every 30s + on page hide
    setInterval(saveGame,30000);
    document.addEventListener('visibilitychange',()=>{
        if(document.hidden){saveGame();stopGameplaySession();}
        else if(gameplaySessionStarted&&!S.popup&&!adBreakActive)startGameplaySession();
    });
    setLoadingPercent(100);
    gameContainer.visible=true;
    hideLoadingOverlay();
    startCurrentAgeProgress();
    startCurrentSpeciesProgress();
    if(welcomeLegacyZoo)showEvolutionChoicePopup({welcomeLegacy:true,onContinue:()=>{
        if(showDeferredOfflinePopup)showDeferredOfflinePopup();
        else if(S.pendingEndgamePopup)showExtinctionAvertedPopup();
    }});
    clearBootRetry();
    console.log(`Game ready in ${Math.round(performance.now()-bootStarted)}ms`);
}
init().catch(bootError=>{
    if(!bootRetryUsed()&&markBootRetry()){
        console.warn('Boot failed, reloading once:',bootError);
        setTimeout(()=>location.reload(),600);
        return;
    }
    showBootFailure(bootError);
});
window.addEventListener('pointerdown',startGameplayFromInteraction,{passive:true});
window.addEventListener('keydown',startGameplayFromInteraction,{passive:true});
window.addEventListener('touchstart',startGameplayFromInteraction,{passive:true});
window.requestRewardedAd=async(onReward)=>{
    const ok=await requestRewardedBreak('window_request_rewarded');
    if(ok&&typeof onReward==='function')onReward();
    return ok;
};
window.dumpGridDebug=dumpGridDebug;
window.addEventListener('keydown',(e)=>{if(e.code==='Backquote')dumpGridDebug('hotkey');});
window.addEventListener('keydown',(e)=>{if(DEV_MODE&&e.code==='KeyB')cycleDevBgColor();});
window.addEventListener('keydown',(e)=>{if(DEV_MODE&&e.code==='KeyP')cycleDevPlayFillColor();});
window.addEventListener('keydown',(e)=>{if(DEV_MODE&&e.code==='KeyC'){if(!S.devTools)S.devTools={};S.devTools.showCollision=!S.devTools.showCollision;updCollisionDebug();}});
window.addEventListener('keydown',(e)=>{if(DEV_MODE&&!S.popup&&e.code==='KeyE')triggerEggStorm();});
window.addEventListener('keydown',(e)=>{
    if(!DEV_MODE||S.popup)return;
    if(!S.devTools)S.devTools={};
    if(!S.devTools.milestoneTestOrdinal)S.devTools.milestoneTestOrdinal=1;
    if(e.code==='BracketLeft'){
        S.devTools.milestoneTestOrdinal=Math.max(1,(S.devTools.milestoneTestOrdinal|0)-1);
        S.devTools.updateMilestoneDebugLabel?.();
    }else if(e.code==='BracketRight'){
        S.devTools.milestoneTestOrdinal=Math.min(20,(S.devTools.milestoneTestOrdinal|0)+1);
        S.devTools.updateMilestoneDebugLabel?.();
    }
});
window.addEventListener('keydown',(e)=>{
    if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='Space')e.preventDefault();
},{passive:false});
window.addEventListener('wheel',(e)=>e.preventDefault(),{passive:false});

function applyViewportResize(){
    const vp=getHostViewportSize();
    app.renderer.resize(vp.w,vp.h);
    resizeGame();
    if(S.popupRoot&&S.popupRoot._relayout)S.popupRoot._relayout();
    if(S.collDetail?.root?._relayout)S.collDetail.root._relayout();
    if(S.devTools?.confettiBtn?._relayout)S.devTools.confettiBtn._relayout();
    if(S.devTools?.stormBtn?._relayout)S.devTools.stormBtn._relayout();
    if(S.devTools?.cardBtn?._relayout)S.devTools.cardBtn._relayout();
    if(S.devTools?.milestoneDownBtn?._relayout)S.devTools.milestoneDownBtn._relayout();
    if(S.devTools?.milestoneUpBtn?._relayout)S.devTools.milestoneUpBtn._relayout();
    if(S.devTools?.colorReadout?._relayout)S.devTools.colorReadout._relayout();
    if(S.devTools?.nextMeteorBtn?._relayout)S.devTools.nextMeteorBtn._relayout();
    if(S.devTools?.popupBtn?._relayout)S.devTools.popupBtn._relayout();
    if(S.devTools?.overlapBtn?._relayout)S.devTools.overlapBtn._relayout();
    if(S.devTools?.econTxt?._relayout)S.devTools.econTxt._relayout();
}

// Smooth resize — follow actual host size, not only raw window size
window.addEventListener('resize',applyViewportResize);
if(window.visualViewport){
    window.visualViewport.addEventListener('resize',applyViewportResize);
}
if(typeof ResizeObserver!=='undefined'){
    const hostResizeObserver=new ResizeObserver(()=>applyViewportResize());
    hostResizeObserver.observe(document.documentElement);
    if(document.body)hostResizeObserver.observe(document.body);
}
</script>
</body>
</html>
