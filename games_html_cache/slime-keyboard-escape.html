        <script id="startup-telemetry">
            // This small observer runs before the blocking SDK and main bundle. One terminal HTTP report describes
            // the same launch cohort at every step, including launches that never establish a game-room connection.
            ;(() => {
                let endpoint = document.querySelector('meta[name="startup-telemetry-endpoint"]').content
                if (endpoint.charAt(0) === '_') {
                    endpoint = window.location.hostname === 'localhost' ? 'http://127.0.0.1:2590/startup-telemetry' : ''
                }
                let touch = null
                let loginSeconds = null
                let worldSeconds = null
                let finished = false
                let hadError = false
                const elapsed = () => Math.min(120, Math.max(0, performance.now() / 1000))
                const onPageHide = () => finish('closed')
                const onRejection = () => { hadError = true }
                const onError = (event) => {
                    const target = event.target
                    if (target === window) hadError = true
                    if (target instanceof HTMLElement && target.hasAttribute('data-client-asset')) finish('error')
                }
                const finish = (outcome) => {
                    if (finished) return
                    finished = true
                    window.clearTimeout(timer)
                    window.removeEventListener('pagehide', onPageHide)
                    window.removeEventListener('error', onError, true)
                    window.removeEventListener('unhandledrejection', onRejection)
                    if (!endpoint) return
                    if (hadError && (outcome === 'closed' || outcome === 'timeout')) outcome = 'error'
                    const body = JSON.stringify({ outcome, touch, durationSeconds: elapsed(), loginSeconds, worldSeconds })
                    // text/plain avoids an unload-time CORS preflight. The server validates the JSON and origin.
                    try {
                        if (
                            navigator.sendBeacon &&
                            navigator.sendBeacon(endpoint, new Blob([body], { type: 'text/plain' }))
                        ) {
                            return
                        }
                    } catch {}
                    try {
                        fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body,
                            credentials: 'omit',
                            keepalive: true
                        }).catch(() => {})
                    } catch {}
                }
                const mark = (step) => {
                    if (finished) return
                    if (performance.now() / 1000 >= 120) {
                        finish('timeout')
                        return
                    }
                    if (step === 'login' && loginSeconds === null) loginSeconds = elapsed()
                    if (step === 'world' && worldSeconds === null) worldSeconds = elapsed()
                    // A ghost spawn can make the world walkable before login completes; neither fact implies the other.
                    if (loginSeconds !== null && worldSeconds !== null) finish('completed')
                }
                const timer = window.setTimeout(() => finish('timeout'), Math.max(0, 120000 - performance.now()))
                window.addEventListener('pagehide', onPageHide)
                window.addEventListener('error', onError, true)
                window.addEventListener('unhandledrejection', onRejection)
                window.__slimeStartup = {
                    setTouch: (isTouch) => {
                        if (!finished) touch = isTouch
                    },
                    configure: (url, isTouch) => {
                        if (finished) return
                        endpoint = url
                        touch = isTouch
                    },
                    loginSucceeded: () => mark('login'),
                    worldPlayable: () => mark('world'),
                    error: () => finish('error')
                }
            })()
        </script>

                    if (event.touches.length > 1) {
                        event.preventDefault()
                    }
                },
                { passive: false }
            )

            // Prevents double-tap zoom
            let lastTouchEnd = 0
            document.addEventListener(
                'touchend',
                function (event) {
                    let now = new Date().getTime()
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault()
                    }
                    lastTouchEnd = now
